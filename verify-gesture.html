<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>제스처 검증</title>
<style>
  html,body{margin:0;height:100%;background:#DED8CE;overflow:hidden}
  iframe{width:100vw;height:100vh;border:0;display:block}
  #log{position:fixed;left:8px;bottom:8px;max-width:46vw;max-height:38vh;overflow:auto;margin:0;
    background:rgba(20,20,20,.82);color:#C9F5C9;font:11px/1.45 monospace;padding:8px 10px;border-radius:10px;
    white-space:pre-wrap;z-index:99999}
  #log.off{display:none}
</style></head>
<body>
<pre id="log"></pre>
<script>
/* 🧪 제스처 검증 하네스 — 앱을 iframe 에 띄우고 진짜 PointerEvent 로 조작한다
   ?mode=swipe | lift | move | rot | home | reload   &reset=1  &quiet=1 */
(function(){
  var q = new URLSearchParams(location.search);
  var MODE = q.get('mode') || 'move';
  var QUIET = q.get('quiet') === '1';
  var logEl = document.getElementById('log');
  if (QUIET) logEl.className = 'off';
  var L = [];
  function log(m, o){ var s = m + (o !== undefined ? ' ' + JSON.stringify(o) : ''); L.push(s); logEl.textContent = L.join('\n'); }
  window.__res = L;
  if (q.get('reset') === '1'){ try { localStorage.removeItem('familyDash.verify.root.v1'); } catch(e){} }
  var f = document.createElement('iframe');
  f.id = 'f';
  f.setAttribute('aria-hidden', 'true');
  f.setAttribute('tabindex', '-1');
  f.src = './verify-coaster.html?pg=1&h=' + Date.now();
  document.body.insertBefore(f, document.body.firstChild);

  function W(){ return f.contentWindow; }
  function PG(){ return W().__pg; }
  function ST(){ return PG().state; }
  function cv(){ return ST().renderer.domElement; }
  function ev(type, x, y, id){
    var e = new PointerEvent(type, { pointerId: id || 1, pointerType: 'touch', clientX: x, clientY: y,
      bubbles: true, cancelable: true, isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 });
    cv().dispatchEvent(e);
  }
  function where(){ var r = cv().getBoundingClientRect(); return r; }
  function scr(x, y, z){
    var v = new THREE.Vector3(x, y, z).project(ST().camera);
    var r = where();
    return { x: (v.x * 0.5 + 0.5) * r.width + r.left, y: (-v.y * 0.5 + 0.5) * r.height + r.top };
  }
  function snap(tag){
    var s = ST(), g = s.rides.coaster.g;
    var o = { tag: tag, mode: s.mode,
      pos: [+g.position.x.toFixed(2), +g.position.z.toFixed(2)], rot: +g.rotation.y.toFixed(2),
      lift: +(g.userData.lift || 0).toFixed(2),
      ring: !!(s.rideRing && s.rideRing.visible),
      bar: !f.contentDocument.getElementById('pgRideBar').hidden,
      barName: f.contentDocument.getElementById('pgrName').textContent,
      rides: JSON.stringify((s.pgRides && s.pgRides[s.kid]) || {}) };
    log(tag, o);
    return o;
  }
  function camCast(){
    var s = ST();
    s.camTween = null;
    s.target.set(-62, 1.2, 15.0);
    s.dist = s.distGoal = 30;
    s.polar = 0.72;
    s.azim = 0.15;
  }
  function camBeach(){
    var s = ST();
    s.camTween = null;
    s.target.set(14, 1.0, -4);
    s.dist = s.distGoal = 34;
    s.polar = 0.80;
    s.azim = 0.15;
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function until(fn, ms){
    return new Promise(function(res, rej){
      var t0 = Date.now();
      (function tick(){
        var v = null; try { v = fn(); } catch(e){}
        if (v) return res(v);
        if (Date.now() - t0 > ms) return rej(new Error('timeout'));
        setTimeout(tick, 120);
      })();
    });
  }

  (async function(){
    try {
      await until(function(){ var s = ST(); return s && s.ready && s.on && s.charOrder.length >= 3; }, 25000);
      await wait(600);
      log('ready', {dist: Math.round(ST().dist), chars: ST().charOrder.length});
      camCast();
      await wait(700);

      var p = scr(-58.5, 0.6, 16.2);
      var hit = PG().pick({ clientX: p.x, clientY: p.y });
      log('pick', { x: Math.round(p.x), y: Math.round(p.y), type: hit && hit.type, key: hit && hit.key });
      var home = snap('before');

      /* ① 짧은 터치 + 스와이프 — 기구는 그대로, 화면만 이동 */
      ev('pointerdown', p.x, p.y);
      log('after-down', { mode: ST().mode });
      await wait(60);
      ev('pointermove', p.x + 90, p.y + 6);
      await wait(60);
      var sw = snap('swipe-move');
      ev('pointerup', p.x + 90, p.y + 6);
      await wait(120);
      var swUp = snap('swipe-up');
      log('swipe-verdict', { panOnly: sw.mode === 'pan', rideMoved: sw.pos[0] !== home.pos[0] || sw.pos[1] !== home.pos[1] });
      if (MODE === 'swipe') return log('done-swipe');

      /* 화면을 되돌리고 다시 기구 위를 꾹 */
      camCast();
      await wait(700);
      p = scr(-58.5, 0.6, 16.2);
      ev('pointerdown', p.x, p.y);
      await wait(430);
      var lift = snap('hold-430');
      log('hold-verdict', { rdrag: lift.mode === 'rdrag', ring: lift.ring });
      if (MODE === 'lift'){ log('holding…'); return; }

      /* ② 화면 오른쪽 끝에 손가락을 두고 바닷가까지 카메라가 따라가게 */
      var r = where();
      ev('pointermove', r.width - 6, r.height * 0.5);
      for (var i = 0; i < 16; i++){
        await wait(500);
        var g = ST().rides.coaster.g;
        if (g.position.x > 6) break;
      }
      snap('edge-pan');
      ev('pointerup', r.width - 6, r.height * 0.5);
      await wait(150);
      var drop = snap('drop');
      log('move-verdict', { mode: drop.mode, saved: drop.rides });
      camBeach();
      await wait(600);
      snap('at-beach');
      if (MODE === 'move') return log('done-move');

      /* ③ ↻ 45° 돌리기 */
      var rotBtn = f.contentDocument.querySelector('#pgRideBar [data-pgr="rot"]');
      rotBtn.click();
      await wait(200);
      snap('after-rot');
      if (MODE === 'rot') return log('done-rot');

      /* ④ 🏠 원래 자리 */
      f.contentDocument.querySelector('#pgRideBar [data-pgr="home"]').click();
      await wait(200);
      snap('after-home');
      camCast();
      await wait(700);
      snap('home-view');
      log('done');
    } catch(e){
      log('ERROR ' + (e && e.message));
    }
  })();
})();
</script>
</body></html>
