<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>모바일 390 확인</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE}
  body{display:flex;justify-content:center;padding:10px 0}
  iframe{width:390px;height:3400px;border:0;border-radius:16px;background:#FFFDF9;box-shadow:0 6px 20px rgba(0,0,0,.18)}
</style></head>
<body><iframe id="f" src="./preview-study.html?mobile=1"></iframe>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument;
      var t = d.querySelector('#study');
      if (t) setTimeout(function(){ t.scrollIntoView({block:'start'}); }, 600);
    }catch(e){}
  });
</script>
</body></html>
