<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>독서 1P · 도감 세트 확인 · 390 × 844</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE}
  body{display:flex;justify-content:center;padding:8px 0}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#FFFDF9;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style></head>
<body>
<iframe id="f" src="./zz-rg-app2.html?reset=1"></iframe>
<script>
/* iframe 에도 같은 버전 쿼리를 넘겨 GitHub Pages 캐시를 피한다 */
(function(){
  var f = document.getElementById('f');
  var v = (/[?&]v=([\w.-]+)/.exec(location.search) || [])[1];
  if (v) f.src = './zz-rg-app2.html?reset=1&v=' + v;
})();
</script>
<script>
/* ?to=reading 이면 독서 카드, ?to=top 이면 맨 위(프로필 포인트)로 스크롤 */
(function(){
  var f = document.getElementById('f');
  var to = (/[?&]to=([a-z]+)/.exec(location.search) || [])[1] || 'reading';
  var tries = 0;
  var iv = setInterval(function(){
    tries++;
    try {
      var d = f.contentWindow.document;
      var el = to === 'top' ? document.body : null;
      var target = (to === 'reading') ? d.getElementById('reading') : null;
      var ready = d.getElementById('reading') && d.getElementById('reading').innerHTML.length > 200;
      if (ready){
        if (target) target.scrollIntoView({ block:'start' });
        else f.contentWindow.scrollTo(0, 0);
        clearInterval(iv);
      }
    } catch(e){}
    if (tries > 200) clearInterval(iv);
  }, 150);
})();
</script>
</body></html>
