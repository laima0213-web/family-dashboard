<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 폭 확인용</title>
<style>
  html,body{margin:0;background:#E9E4DA;overflow:hidden}
  .wrap{display:flex;justify-content:center}
  iframe{border:0;width:390px;height:3400px;background:#FFFDF9;display:block}
</style>
</head>
<body>
<div class="wrap"><iframe id="f" src="about:blank"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var h = Number(p.get('h') || 0);
  if (h) f.style.height = h + 'px';
  var top = Number(p.get('top') || 0);
  if (top) f.style.marginTop = (-top) + 'px';
  f.src = './index.html?t=' + Date.now();
</script>
</body>
</html>
