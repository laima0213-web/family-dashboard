<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>폭 확인용</title>
<style>
  html,body{margin:0;background:#E9E4DA;overflow:hidden}
  .wrap{display:flex;justify-content:center;transform-origin:top center}
  iframe{border:0;width:390px;height:3400px;background:#FFFDF9;display:block}
</style>
</head>
<body>
<div class="wrap" id="w"><iframe id="f" src="about:blank"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var fr = document.getElementById('f');
  var wpx = Number(q.get('w') || 0);
  var hpx = Number(q.get('h') || 0);
  var sc = Number(q.get('s') || 0);
  if (wpx) fr.style.width = wpx + 'px';
  if (hpx) fr.style.height = hpx + 'px';
  if (sc) document.getElementById('w').style.transform = 'scale(' + sc + ')';
  var skips = Number(q.get('top') || 0);
  if (skips) fr.style.marginTop = (-skips) + 'px';
  fr.src = './index.html?t=' + Date.now();
</script>
</body>
</html>
