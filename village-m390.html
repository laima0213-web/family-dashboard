<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>동화마을 390 × 844 확인</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE}
  body{display:flex;justify-content:center;padding:8px 0}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#FFFDF9;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style></head>
<body>
<iframe id="f" src="./village-check.html?pg=1&reset=1&v=6"></iframe>
<script>
(function(){
  var f = document.getElementById('f'), n = 0;
  var iv = setInterval(function(){
    n++;
    try {
      var w = f.contentWindow;
      if (w && w.__cam && w.__pg && w.__pg.state && w.__pg.state.ready){
        w.__cam(-20, -7.2, 19.0, 0.92, 0.28);
        clearInterval(iv);
      }
    } catch(e){}
    if (n > 250) clearInterval(iv);
  }, 150);
})();
</script>
</body></html>
