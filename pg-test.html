<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>놀이터 동작 테스트 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE;font:12px/1.4 -apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}
  body{display:flex;gap:14px;padding:12px;align-items:flex-start}
  iframe{width:390px;flex:0 0 390px;height:844px;border:0;border-radius:18px;background:#FFFDF9;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  #wrap{flex:1;min-width:0}
  #log{white-space:pre-wrap;background:#1f2430;color:#d7e3d1;border-radius:12px;padding:10px;font-size:11.5px;max-height:820px;overflow:auto}
  #state{margin-top:8px;font-size:11px;color:#5b5348;white-space:nowrap}
</style></head>
<body>
<iframe id="f" src="./index.html?pgtest=1"></iframe>
<div id="wrap"><div id="log">시작…</div><div id="state"></div></div>
<script>
(function(){
  var out = [], f = document.getElementById('f'), box = document.getElementById('log');
  function L(s){ out.push(s); box.textContent = out.join('\n'); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function until(fn, ms){
    return new Promise(function(res, rej){
      var t0 = Date.now();
      (function tick(){
        var v = null;
        try { v = fn(); } catch(e){ v = null; }
        if (v) return res(v);
        if (Date.now() - t0 > (ms || 15000)) return rej(new Error('timeout'));
        setTimeout(tick, 120);
      })();
    });
  }
  function ev(w, type, x, y, id){
    var cv = w.document.querySelector('#pgStage canvas');
    var e = new w.PointerEvent(type, { bubbles:true, cancelable:true, pointerId:(id||1), pointerType:'touch',
      isPrimary:true, clientX:x, clientY:y, buttons: type === 'pointerup' ? 0 : 1 });
    cv.dispatchEvent(e);
  }
  function screenOf(w, v){
    var S = w.__pg.state, cam = S.camera, cv = S.renderer.domElement;
    var r = cv.getBoundingClientRect();
    var p = v.clone().project(cam);
    return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (-p.y * 0.5 + 0.5) * r.height };
  }
  function pgArr(w){ try { return JSON.parse(w.eval("JSON.stringify((state.playground||{}).k1||[])")); } catch(e){ return []; } }
  function dragTo(w, from, to, id){
    ev(w, 'pointerdown', from.x, from.y, id);
    for (var i = 1; i <= 12; i++) ev(w, 'pointermove', from.x + (to.x - from.x) * i / 12, from.y + (to.y - from.y) * i / 12, id);
    ev(w, 'pointerup', to.x, to.y, id);
  }

  f.addEventListener('load', function(){ run().catch(function(e){ L('FAIL ' + (e && e.message)); }); });

  async function run(){
    var w = f.contentWindow, d = w.document;
    L('iframe load');

    await until(function(){ return w.__pg; }, 20000);
    try {
      w.eval("window.__writes=0; DB.patch=function(){ window.__writes++; return Promise.resolve(true); }; onRemoteRoot=function(){};");
      L('DB.patch 차단 · 실시간 갱신 정지 (테스트용)');
    } catch(e){ L('mock fail ' + e); }
    await until(function(){ return d.getElementById('app') && !d.getElementById('app').hidden; }, 20000);
    L('앱 잠금 해제됨');

    /* 📖 공부 체크리스트 헤더 한 줄 확인 */
    function studyLine(tag){
      var h2 = d.querySelector('#study .h2');
      if (!h2) return L(tag + ' · #study .h2 없음');
      var tn = null;
      Array.prototype.forEach.call(h2.childNodes, function(n){ if (!tn && n.nodeType === 3 && n.textContent.trim()) tn = n; });
      var rng = d.createRange(); rng.selectNodeContents(tn);
      var rects = rng.getClientRects();
      var ttop = rects.length ? Math.round(rects[0].top) : 0;
      var kids = Array.prototype.slice.call(h2.children).filter(function(el){ return el.offsetWidth > 0; });
      var same = kids.every(function(el){ return Math.abs(Math.round(el.getBoundingClientRect().top) - ttop) <= 4; });
      L(tag + ' · h2 높이 ' + Math.round(h2.getBoundingClientRect().height) + 'px · 제목 줄수 ' + rects.length
        + ' · 배지 같은 줄=' + same + ' · 넘침 ' + (h2.scrollWidth > h2.clientWidth + 1)
        + ' · 카드폭 ' + h2.clientWidth);
    }
    studyLine('390px 공부헤더');
    var pf = d.querySelector('#kidA .prof-btns');
    L('390px 프로필 버튼 폭 ' + Math.round(pf.getBoundingClientRect().width) + ' · 넘침=' + (pf.scrollWidth > pf.clientWidth + 1)
      + ' · ' + Array.prototype.map.call(pf.children, function(b){ return b.textContent.trim(); }).join(' | '));
    f.style.width = '360px'; f.style.flexBasis = '360px';
    await sleep(500);
    L('iframe 폭 360 확인: innerWidth=' + w.innerWidth);
    studyLine('360px 공부헤더');
    var pf2 = d.querySelector('#kidA .prof-btns');
    L('360px 프로필 버튼 폭 ' + Math.round(pf2.getBoundingClientRect().width) + ' · 넘침=' + (pf2.scrollWidth > pf2.clientWidth + 1));
    f.style.width = '390px'; f.style.flexBasis = '390px';
    await sleep(500);

    /* 🌳 놀이터 열기 (실제 버튼 클릭) */
    d.querySelector('[data-act="playground-open"][data-m="k1"]').click();
    await until(function(){ return w.__pg.state.ready || w.__pg.state.failed; }, 30000);
    await sleep(800);
    var S = w.__pg.state, pgEl = d.getElementById('pg');
    var r = pgEl.getBoundingClientRect();
    var ex = d.getElementById('pgExit').getBoundingClientRect();
    var cv = S.renderer.domElement;
    L('놀이터 열림 · ready=' + S.ready + ' failed=' + S.failed);
    L('오버레이 ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' / 화면 ' + w.innerWidth + 'x' + w.innerHeight
      + ' · fixed=' + w.getComputedStyle(pgEl).position + ' · z=' + w.getComputedStyle(pgEl).zIndex);
    L('나가기 버튼 ' + Math.round(ex.width) + 'x' + Math.round(ex.height) + ' @ x=' + Math.round(ex.left) + ' y=' + Math.round(ex.top)
      + ' · 오른쪽위=' + (ex.left > w.innerWidth * 0.6 && ex.top < 90));
    L('놀이기구 ' + Object.keys(S.rides).length + '종 · 이름표 ' + S.labels.length + '개 · 캔버스 ' + cv.width + 'x' + cv.height);

    /* 보유 캐릭터 주입 → 꾸미기 목록 갱신 */
    w.eval("state.shop=state.shop||{}; state.shop.unlocked=state.shop.unlocked||{}; state.shop.unlocked.k1=['preset:fox_sailor','preset:bun_ribbon','preset:panda_hood','preset:princess_tiara'];");
    var decoBtn = d.getElementById('pgDecoBtn');
    decoBtn.click(); await sleep(120); decoBtn.click(); await sleep(200);
    var cards = d.querySelectorAll('[data-pgadd]');
    L('꾸미기 보유 카드 ' + cards.length + '개');

    /* 캐릭터 3명 넣기 */
    for (var i = 0; i < 3 && i < cards.length; i++){
      d.querySelectorAll('[data-pgadd]')[i].click();
      await sleep(160);
    }
    await sleep(400);
    L('캐릭터 ' + S.charOrder.length + '명 · 저장값 ' + JSON.stringify(pgArr(w).map(function(x){ return [x.preset, x.x, x.z, x.ride]; })));

    /* 360도 회전 */
    var az0 = S.azim, po0 = S.polar;
    ev(w, 'pointerdown', 195, 300, 7);
    for (var k = 1; k <= 12; k++) ev(w, 'pointermove', 195 + k * 26, 300, 7);
    ev(w, 'pointerup', 195 + 12 * 26, 300, 7);
    await sleep(150);
    var az1 = S.azim;
    ev(w, 'pointerdown', 195, 300, 8);
    for (var k2 = 1; k2 <= 5; k2++) ev(w, 'pointermove', 195, 300 - k2 * 20, 8);
    ev(w, 'pointerup', 195, 300 - 5 * 20, 8);
    await sleep(150);
    L('회전: azimuth ' + az0.toFixed(2) + ' → ' + az1.toFixed(2) + ' rad (' + ((az1 - az0) * 180 / Math.PI).toFixed(0) + '도) · polar ' + po0.toFixed(2) + ' → ' + S.polar.toFixed(2));
    await sleep(300);

    /* 캐릭터 → 방방이 드래그 */
    var id0 = S.charOrder[1];
    var from = screenOf(w, S.chars[id0].sp.position.clone().add(new w.THREE.Vector3(0, 0.7, 0)));
    var to = screenOf(w, S.rides.tramp.g.position.clone().add(new w.THREE.Vector3(0, 0.35, 0)));
    dragTo(w, from, to, 11);
    await sleep(500);
    var rec0 = pgArr(w).filter(function(x){ return x.id === id0; })[0];
    L('방방이 드롭: ride=' + (rec0 && rec0.ride) + ' · 높이 y=' + S.chars[id0].sp.position.y.toFixed(2));

    /* 캐릭터 → 시소 드래그 */
    var id1 = S.charOrder[2];
    var from2 = screenOf(w, S.chars[id1].sp.position.clone().add(new w.THREE.Vector3(0, 0.7, 0)));
    var to2 = screenOf(w, S.rides.seesaw.g.position.clone().add(new w.THREE.Vector3(0, 0.35, 0)));
    dragTo(w, from2, to2, 12);
    await sleep(500);
    var rec1 = pgArr(w).filter(function(x){ return x.id === id1; })[0];
    L('시소 드롭: ride=' + (rec1 && rec1.ride) + ' · 높이 y=' + S.chars[id1].sp.position.y.toFixed(2));

    /* 캐릭터 → 잔디로 내려놓기 */
    var from3 = screenOf(w, S.chars[id0].sp.position.clone().add(new w.THREE.Vector3(0, 0.6, 0)));
    var to3 = screenOf(w, new w.THREE.Vector3(1.6, 0.1, 1.4));
    dragTo(w, from3, to3, 13);
    await sleep(500);
    var rec2 = pgArr(w).filter(function(x){ return x.id === id0; })[0];
    L('풀밭 드롭: ride=' + (rec2 && rec2.ride ? rec2.ride : '(없음)') + ' · 저장좌표 ' + (rec2 ? rec2.x + ',' + rec2.z : '-'));

    /* 확대 버튼 */
    var dg = S.distGoal;
    d.getElementById('pgZoomIn').click(); await sleep(200);
    var dg2 = S.distGoal;
    d.getElementById('pgZoomOut').click();
    L('줌 버튼: ' + dg.toFixed(1) + ' → ' + dg2.toFixed(1));

    /* 이름표 토글 */
    var lb = d.getElementById('pgLabels');
    d.getElementById('pgLblBtn').click();
    L('이름표 토글: off=' + lb.classList.contains('off'));
    d.getElementById('pgLblBtn').click();

    /* 꾸미기에서 빼기 */
    var before = S.charOrder.length;
    d.querySelector('[data-pgdel]').click();
    await sleep(300);
    L('빼기: ' + before + '명 → ' + S.charOrder.length + '명 · 저장 ' + pgArr(w).length + '개');

    L('DB.patch 호출 ' + (w.__writes || 0) + '회 · 콘솔오류 ' + JSON.stringify(w.__errs || []));

    /* 최종 화면: 꾸미기 닫고 캐릭터 보이게 */
    d.getElementById('pgDeco').hidden = true;
    await sleep(1200);
    L('최종 캐릭터 ' + S.charOrder.length + '명 · 이름표 ' + (d.getElementById('pgLabels').className || 'on'));
    document.getElementById('state').textContent = '테스트 끝 · ' + new Date().toISOString();
  }
})();
</script>
</body></html>
