/* ============================================================
   21. 잠금 화면 (PIN)
   ============================================================ */
var pinRec = null;                 // { hash, salt }
var lockMode = 'loading';
var entry = '';
var firstPin = '';
var failCount = 0;
var coolUntil = 0;
var coolTimer = null;
var pinChanging = false;

var LOCK_TEXT = {
  loading:   { emoji:'🔐', sub:'잠금 상태를 확인하는 중…' },
  unlock:    { emoji:'🔐', sub:'가족 PIN ' + CONFIG.PIN_LEN + '자리를 눌러 주세요' },
  setup:     { emoji:'✨', sub:'우리집에서 쓸 PIN ' + CONFIG.PIN_LEN + '자리를 정해 주세요' },
  setup2:    { emoji:'✨', sub:'확인을 위해 한 번 더 눌러 주세요' },
  'change-old': { emoji:'🔑', sub:'지금 쓰는 PIN ' + CONFIG.PIN_LEN + '자리를 눌러 주세요' }
};
function paintDots(){
  var box = $('#lockDots'); if (!box) return;
  var html = '';
  for (var i=0;i<CONFIG.PIN_LEN;i++) html += '<i class="ldot' + (i < entry.length ? ' on' : '') + '"></i>';
  box.innerHTML = html;
}
function setLockMsg(msg){ setText('#lockMsg', msg || ''); }
function setLockMode(mode){
  lockMode = mode;
  var t = LOCK_TEXT[mode] || LOCK_TEXT.unlock;
  setText('#lockEmoji', t.emoji);
  setText('#lockSub', t.sub);
  setLockMsg('');
  entry = '';
  paintDots();
  var chBtn = $('#pinChangeBtn');
  if (chBtn) chBtn.hidden = !(pinRec && mode === 'unlock');
  var imBtn = $('#seedImportBtn');
  if (imBtn) imBtn.hidden = !!DB.isRemote();
  var rm = $('#lockRemember');
  if (rm && prefs) rm.checked = prefs.remember !== false;
}
function shakeLock(){
  var c = $('#lockCard'); if (!c) return;
  c.classList.remove('shake');
  void c.offsetWidth;
  c.classList.add('shake');
}
function coolDown(leftMs){
  var btnKeys = $$('#keypad .key');
  btnKeys.forEach(function(b){ b.disabled = true; });
  var showLeft = function(){
    var left = Math.ceil((coolUntil - Date.now())/1000);
    if (left > 0){ setLockMsg('잠시 후 다시 눌러 주세요 (' + left + '초)'); }
    else {
      clearInterval(coolTimer); coolTimer = null;
      btnKeys.forEach(function(b){ b.disabled = false; });
      setLockMsg('');
    }
  };
  coolUntil = Date.now() + leftMs;
  clearInterval(coolTimer);
  coolTimer = setInterval(showLeft, 400);
  showLeft();
}
function wrongPin(msg){
  failCount++;
  shakeLock();
  if (navigator.vibrate){ try { navigator.vibrate(60); } catch(e){} }
  entry = ''; paintDots();
  if (failCount >= CONFIG.PIN_MAX_FAIL){
    failCount = 0;
    coolDown(CONFIG.PIN_COOL_MS);
  } else {
    setLockMsg(msg || 'PIN이 맞지 않아요');
  }
}
function pressKey(k){
  if (lockMode === 'loading') return;
  if (Date.now() < coolUntil) return;
  if (k === 'del'){ entry = entry.slice(0, -1); paintDots(); return; }
  if (k === 'clr'){ entry = ''; paintDots(); setLockMsg(''); return; }
  if (!/^[0-9]$/.test(k)) return;
  if (entry.length >= CONFIG.PIN_LEN) return;
  entry += k;
  setLockMsg('');
  paintDots();
  if (entry.length === CONFIG.PIN_LEN) setTimeout(submitEntry, 90);
}
async function submitEntry(){
  var pin = entry;
  if (pin.length !== CONFIG.PIN_LEN) return;
  if (lockMode === 'unlock' || lockMode === 'change-old'){
    var digest = await pinDigest(pin, pinRec ? pinRec.salt : '');
    if (pinRec && digest === pinRec.hash){
      failCount = 0;
      entry = ''; paintDots();
      if (lockMode === 'change-old'){ pinChanging = true; setLockMode('setup'); return; }
      writeToken(!!($('#lockRemember') || {}).checked);
      unlockApp(false);
      return;
    }
    wrongPin('PIN이 맞지 않아요');
    return;
  }
  if (lockMode === 'setup'){
    firstPin = pin;
    entry = ''; paintDots();
    setLockMode('setup2');
    return;
  }
  if (lockMode === 'setup2'){
    if (pin === firstPin){
      await savePin(pin);
    } else {
      firstPin = '';
      setLockMode('setup');
      setLockMsg('두 번 입력한 PIN이 달라요 · 처음부터 다시');
      shakeLock();
    }
    return;
  }
}
async function savePin(pin){
  var salt = randomHex(8);
  var hash = await pinDigest(pin, salt);
  pinRec = { hash: hash, salt: salt };
  try {
    await DB.patch({ 'auth/pinHash': hash, 'auth/salt': salt, 'auth/updatedAt': Date.now() });
  } catch(e){
    console.warn('[dashboard] PIN 저장 실패:', e && e.message);
  }
  var rec = !!($('#lockRemember') || {}).checked;
  writeToken(rec);
  var wasChanging = pinChanging;
  pinChanging = false;
  firstPin = '';
  entry = ''; paintDots();
  await unlockApp(true);
  toast(wasChanging ? '🔑 PIN을 바꿨어요' : '🔐 우리집 PIN을 만들었어요', 2600);
}
function readToken(){
  try { return JSON.parse(localStorage.getItem(CONFIG.TOKEN_KEY) || 'null'); } catch(e){ return null; }
}
function writeToken(on){
  try {
    if (on && pinRec) localStorage.setItem(CONFIG.TOKEN_KEY, JSON.stringify({ h: pinRec.hash, at: Date.now() }));
    else localStorage.removeItem(CONFIG.TOKEN_KEY);
  } catch(e){}
}
function clearToken(){ try { localStorage.removeItem(CONFIG.TOKEN_KEY); } catch(e){} }
function lockNow(){
  clearToken();
  unlocked = false;
  var app = $('#app'); if (app) app.hidden = true;
  var lk = $('#lock'); if (lk) lk.hidden = false;
  setLockMode('unlock');
  toast('🔒 잠갔어요 · 다시 열려면 PIN이 필요해요');
}
function resolvePin(root){
  var a = (root && root.auth) || {};
  if (a.pinHash) return { hash: String(a.pinHash), salt: String(a.salt || '') };
  if (CONFIG.PIN_HASH) return { hash: CONFIG.PIN_HASH, salt: CONFIG.PIN_SALT || '' };
  return null;
}

/* ============================================================
   22. 백업 · 시드 불러오기
   ============================================================ */
function exportSeed(){
  var payload = {
    _readme: '우리집 대시보드 백업/시드 파일 · 공개 저장소에 올리지 마세요(가족 이름이 들어 있습니다).',
    exportedAt: new Date().toISOString(),
    config: CFG,
    state: state,
    auth: { pinHash: pinRec ? pinRec.hash : '', salt: pinRec ? pinRec.salt : '', updatedAt: Date.now() }
  };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'family-dashboard-seed-' + todayKey() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('⬇ 백업 파일을 내려받았어요 · 이 파일은 공개하지 마세요', 3000);
  } catch(e){
    toast('백업 파일을 만들지 못했어요');
  }
}
function pickSeed(){
  var f = $('#importFile'); if (!f) return;
  if (DB.isRemote()){ toast('가족 DB에 연결된 상태에서는 시드 불러오기를 쓰지 않아요'); return; }
  f.value = '';
  f.click();
}
function applySeed(text){
  var data = null;
  try { data = JSON.parse(text); } catch(e){ toast('JSON 파일을 읽지 못했어요'); return; }
  if (!data || typeof data !== 'object' || !(data.state || data.config)){
    toast('대시보드 백업/시드 파일이 아니에요'); return;
  }
  var ok = window.confirm('이 기기에 저장된 기록을 이 파일로 바꿀까요?\n(지금 기록은 덮어써집니다)');
  if (!ok) return;
  var root = { auth: data.auth || {}, config: data.config || null, state: data.state || null };
  // 시드 파일의 PIN 칸이 비어 있으면, 이 기기에 이미 만든 PIN을 그대로 둔다
  if (!(root.auth && root.auth.pinHash)){
    var prev = null;
    try { prev = JSON.parse(localStorage.getItem(CONFIG.LOCAL_KEY) || 'null'); } catch(e){ prev = null; }
    if (prev && prev.auth && prev.auth.pinHash) root.auth = prev.auth;
  }
  try { localStorage.setItem(CONFIG.LOCAL_KEY, JSON.stringify(root)); } catch(e){}
  if (LocalAdapter.bc){ try { LocalAdapter.bc.postMessage({ t:'patch', paths:{ state: root.state } }); } catch(e){} }
  toast('⬆ 불러왔어요 · 화면을 새로 고칩니다', 1600);
  setTimeout(function(){ location.reload(); }, 700);
}

/* ============================================================
   23. 앱 켜기 (PIN 통과 후)
   ============================================================ */
async function unlockApp(afterPinSetup){
  var root = lastRoot || {};
  var lk = $('#lock'); if (lk) lk.hidden = true;
  var app = $('#app'); if (app) app.hidden = false;
  unlocked = true;
  if (booted){ renderAll(); return; }
  booted = true;

  applyConfig(root.config || DEMO_CONFIG);
  prefs = normalizePrefs(readPrefsRaw());
  state = root.state ? normalizeState(root.state) : initialState({ samples: !DB.isRemote() });
  var isNew = !root.state;

  ensureDay();
  renderAll();

  setInterval(renderClock, 1000);
  ensureWeather();
  DB.subscribe(onRemoteRoot);

  if (isNew){
    lastLocalWriteAt = Date.now();
    Promise.resolve(DB.patch({ state: state })).catch(function(){});
  }
  if (afterPinSetup && isNew) setText('#footStore', DB.isRemote() ? '가족 기기와 실시간으로 맞춰져요' : '이 기기에 저장돼요 · DB를 연결하면 가족과 함께 써요');
}
function onRemoteRoot(root){
  if (!unlocked || !root) return;
  var first = !remoteSeen;
  remoteSeen = true;
  var remote = root.state ? normalizeState(root.state) : null;
  var same = remote && JSON.stringify(remote) === JSON.stringify(state);
  if (root.config){
    var beforeCfg = JSON.stringify(CFG);
    applyConfig(root.config);
    if (JSON.stringify(CFG) !== beforeCfg) same = false;
  }
  if (same) return;
  if (remote) state = remote;
  if (ensureDay()) { /* 날짜가 바뀌었으면 여기서 정리됨 */ }
  renderAll();
  if (!first && Date.now() - lastLocalWriteAt > 1800) toast('다른 기기에서 업데이트됐어요', 1700);
}

/* ============================================================
   24. 날씨 루프
   ============================================================ */
function ensureWeather(){
  if (!prefs) return;
  var w = prefs.weather || {};
  if (w.at && (Date.now() - w.at) < 20*60*1000){ renderWeather(); return; }
  loadWeather();
}
async function loadWeather(){
  if (!/^https?:$/.test(location.protocol)){ renderWeather(); return; }
  try {
    var w = CFG.weather;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon
      + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min'
      + '&timezone=Asia%2FSeoul&forecast_days=1';
    var airUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + w.lat
      + '&longitude=' + w.lon + '&current=pm10,pm2_5&timezone=Asia%2FSeoul';
    var r = await fetch(url);
    var j = await r.json();
    var code = j.current.weather_code, wmo = WMO[code] || ['맑음','☀️'];
    var nw = {
      temp: j.current.temperature_2m,
      min: j.daily.temperature_2m_min[0],
      max: j.daily.temperature_2m_max[0],
      code: code, label: wmo[0], icon: wmo[1],
      pm10: null, pm25: null,
      live: true, at: Date.now()
    };
    try {
      var r2 = await fetch(airUrl);
      var j2 = await r2.json();
      if (j2 && j2.current){
        nw.pm10 = Math.round(j2.current.pm10);
        nw.pm25 = Math.round(j2.current.pm2_5);
      }
    } catch(e){}
    prefs.weather = nw; savePrefs();
    renderWeather();
  } catch(e){
    renderWeather();
  }
}

/* ============================================================
   25. 시작
   ============================================================ */
(function bindLockUI(){
  var pad = $('#keypad');
  if (pad) pad.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-key]') : null;
    if (b) pressKey(b.getAttribute('data-key'));
  });
  document.addEventListener('keydown', function(ev){
    if ($('#lock') && !$('#lock').hidden){
      if (/^[0-9]$/.test(ev.key)) pressKey(ev.key);
      else if (ev.key === 'Backspace'){ ev.preventDefault(); pressKey('del'); }
    }
  });
  var chBtn = $('#pinChangeBtn');
  if (chBtn) chBtn.addEventListener('click', function(){
    if (!pinRec) return;
    setLockMode('change-old');
  });
  var imBtn = $('#seedImportBtn');
  if (imBtn) imBtn.addEventListener('click', pickSeed);
  var f = $('#importFile');
  if (f) f.addEventListener('change', function(){
    var file = f.files && f.files[0];
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){ applySeed(String(rd.result || '')); };
    rd.onerror = function(){ toast('파일을 읽지 못했어요'); };
    rd.readAsText(file);
  });
  var lockBtn = $('#lockBtn');
  if (lockBtn) lockBtn.addEventListener('click', lockNow);
  var rm = $('#lockRemember');
  if (rm) rm.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') closeCommuteSheet();
  });
})();

/* ============================================================
   가족 암호 화면 컨트롤 (처음 1회)
   ============================================================ */
var gateBusy = false;
function setGateMsg(t){ var el = $('#gateMsg'); if (el) el.textContent = t || ''; }
function setGateBusy(on){
  gateBusy = !!on;
  var b = $('#gateBtn'), i = $('#gatePw');
  if (b){ b.disabled = gateBusy; b.textContent = gateBusy ? '확인하는 중…' : '들어가기'; }
  if (i) i.disabled = gateBusy;
}
function showGate(msg){
  var g = $('#gate'); if (g) g.hidden = false;
  var lk = $('#lock'); if (lk) lk.hidden = true;
  setGateMsg(msg || '');
  setTimeout(function(){ var i = $('#gatePw'); if (i && !i.disabled) i.focus(); }, 250);
}
function gateShake(){
  var card = document.querySelector('#gate .lock-card');
  if (!card) return;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
async function submitGate(){
  if (gateBusy) return;
  var input = $('#gatePw');
  var pw = input ? String(input.value || '') : '';
  if (pw.length < 4){ setGateMsg('가족 암호를 넣어 주세요'); gateShake(); return; }
  setGateBusy(true); setGateMsg('');
  try {
    await signInFamily(pw);
    if (input) input.value = '';
    var g = $('#gate'); if (g) g.hidden = true;
    setGateBusy(false);
    await finishBoot();
  } catch(e){
    setGateBusy(false);
    setGateMsg(authErrorText(e));
    gateShake();
    if (input){ input.value = ''; input.focus(); }
  }
}

/* PIN 통과 후 실제 화면 켜기 (기존 start 부분) */
async function finishBoot(){
  setLockMode('loading');
  paintDots();
  var adapter = await DB.connect();
  lastRoot = adapter.root || null;
  applyConfig(lastRoot && lastRoot.config ? lastRoot.config : DEMO_CONFIG);
  prefs = normalizePrefs(readPrefsRaw());

  pinRec = resolvePin(lastRoot);
  var lockSyncEl = $('#lockSync');
  if (lockSyncEl) lockSyncEl.textContent = DB.isRemote()
    ? '🟡 가족 DB 연결 · PIN을 확인하는 중'
    : '이 기기에만 저장 중 · 가족과 함께 쓰려면 DB를 연결해요';

  if (pinRec){
    var tok = readToken();
    if (tok && tok.h === pinRec.hash){
      await unlockApp(false);
      return;
    }
    setLockMode('unlock');
    var lk = $('#lock'); if (lk) lk.hidden = false;
    return;
  }
  setLockMode('setup');
  var lk2 = $('#lock'); if (lk2) lk2.hidden = false;
  if (lockSyncEl) lockSyncEl.textContent = (DB.isRemote() ? '가족 DB 연결됨 · ' : '이 기기에 저장 · ')
    + '처음 한 번만 PIN을 만들면 가족 모두 같은 PIN을 써요';
}

(function boot(){
  setLockMode('loading');
  paintDots();
  var btn = $('#gateBtn'); if (btn) btn.addEventListener('click', submitGate);
  var pwIn = $('#gatePw');
  if (pwIn) pwIn.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); submitGate(); }
  });

  try { prefs = normalizePrefs(readPrefsRaw()); } catch(e){ prefs = null; }
  if (!firebaseConfigured()){ finishBoot(); return; }
  getFamilyUser().then(function(user){
    if (user){ finishBoot(); return; }
    showGate('');
  }).catch(function(e){
    console.warn('[dashboard] 가족 로그인 확인 실패:', e && e.message);
    showGate(e && e.message === 'firebase-sdk-missing' ? '인터넷 연결을 확인한 뒤 새로고침해 주세요' : '');
  });
})();
</script>
