<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="우리 가족 대시보드">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>우리집 대시보드</title>
<style>
/* ============================================================
   우리집 대시보드 v3 — 디자인 토큰
   ============================================================ */
:root{
  --bg:#FBF6EC; --paper:#FFFDFA; --line:#F0E7D7; --ink:#463C34; --sub:#95897B; --faint:#BCAF9F;
  --mint:#EAF7EC; --mintd:#5FA97A; --peach:#FFF1E6; --pink:#FFE9EF; --sky:#E9F3FD; --butter:#FFF6D0;
  --shadow:0 6px 16px rgba(180,158,128,.12);
  --gap:10px; --pad:12px; --r:18px;
  --h2:13.5px; --rt-h:32px; --chip-h:27px; --inp-h:34px; --mini:10.5px; --st-h:20px; --fs:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:var(--fs);line-height:1.45;letter-spacing:-.2px}
h1,h2,h3,p,ul,li{margin:0;padding:0}
ul{list-style:none}
button{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;padding:10px 12px 34px}
.app[hidden]{display:none!important}
.muted{color:var(--sub)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 상단 바 ---------- */
.topbar{display:grid;grid-template-areas:"l l" "c w" "q q";grid-template-columns:auto 1fr;
  align-items:center;gap:8px;margin-bottom:var(--gap)}
.tb-l{grid-area:l;display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);
  border-radius:13px;font-size:19px;box-shadow:var(--shadow)}
.topbar h1{font-size:19px;letter-spacing:-.8px;line-height:1.15}
.tb-date{font-size:11.5px;color:var(--sub);margin-top:1px}
.tb-date b{color:#7C6F60}
.clock{grid-area:c;justify-self:start;display:flex;align-items:baseline;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);white-space:nowrap}
.ck-l{font-size:10px;font-weight:800;color:var(--faint)}
.ck-t{font-size:17px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.wx{grid-area:w;justify-self:end;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden}
.wx-ico{font-size:16px}
.wx-temp{font-size:16px;font-weight:900;letter-spacing:-.5px}
.wx-desc{font-size:10.5px;color:var(--sub);font-weight:700}
.wx-loc{font-size:9.5px;font-weight:800;color:#A2937F;background:#FFF8EE;border:1px solid #F3E6D6;border-radius:999px;padding:2px 7px}
.wx-air{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px}
.g-good{background:#E4F1FD;color:#3E7CB1}.g-ok{background:#E7F6E8;color:#4E9A66}
.g-bad{background:#FFE8E1;color:#C1604A}.g-vbad{background:#FBE0DC;color:#A9442F}

/* ---------- 캐릭터 · 빠른 칩 ---------- */
.ava{width:34px;height:34px;flex:0 0 34px}
.ava svg{width:100%;height:100%;display:block}
.ava.xs{width:20px;height:20px;flex:0 0 20px}
.quickrow{grid-area:q;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cchip{display:flex;align-items:center;gap:4px;height:var(--chip-h);border:1px solid #EADFCB;background:#fff;
  border-radius:999px;padding:0 12px;font-size:11px;font-weight:800;color:#6F6252;cursor:pointer;box-shadow:0 2px 6px rgba(180,158,128,.1)}
.cchip b{color:#C08344}
.cchip.hf{background:linear-gradient(100deg,#FFF3CC,#EAF7EC);border-color:#F0E2B4;color:#8A6A28;cursor:default}

/* ---------- 공통 카드 ---------- */
.grid{display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);min-width:0}
.h2{display:flex;align-items:center;gap:6px;font-size:var(--h2);font-weight:900;letter-spacing:-.5px;margin-bottom:7px}
.h2 small{margin-left:auto;font-size:var(--mini);font-weight:700;color:var(--sub);letter-spacing:0;white-space:nowrap}
.h2 .tail{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:var(--mini);font-weight:700;color:var(--sub)}

/* ---------- 아이 루틴 카드 ---------- */
.kid{position:relative;overflow:hidden}
.kid::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.kid.k1{background:linear-gradient(160deg,#FFFDF6,#FBFBF4)}
.kid.k2{background:linear-gradient(160deg,#FFF9F2,#FDFBF6)}
.kid-hf{box-shadow:0 0 0 2px #F5D98A inset,var(--shadow)}
.kid-head{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.kid-id{min-width:0;flex:1}
.kid-name{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:900;letter-spacing:-.6px}
.ktag{font-size:9px;font-weight:800;color:#A2937F;background:#fff;border:1px solid #EDE4D6;border-radius:999px;padding:1px 6px}
.hfi{font-size:14px;animation:pop .9s ease infinite alternate}
@keyframes pop{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.25) rotate(8deg)}}
.kid-sub{font-size:var(--mini);color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbadge{font-size:10px;font-weight:900;color:#A9762F;background:var(--butter);border:1px solid #F3E3A9;border-radius:999px;padding:3px 8px;white-space:nowrap}
.kdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 2px}
.kdot{height:21px;border-radius:7px;background:#F7F1E6;color:#B3A695;font-size:9px;font-weight:800;
  display:grid;place-items:center}
.kdot.done{background:#DDF1E2;color:#3F8355}
.kdot.miss{background:#FCE6E2;color:#C4654A}
.kdot.today{box-shadow:0 0 0 2px #F2D588 inset;color:#A9801F;background:#FFF7DE}
.kdot.today.done{background:#DDF1E2;box-shadow:0 0 0 2px #8FC7A2 inset;color:#3F8355}
.ktabs{display:flex;gap:3px;background:#F5F0E7;padding:3px;border-radius:12px;margin-top:10px}
.ktab{flex:1;border:0;background:transparent;border-radius:9px;padding:5px 0;font-size:11px;font-weight:800;
  color:#A2937F;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.ktab b{font-size:9.5px;font-weight:900;background:#EBE3D6;color:#8A7C6B;border-radius:999px;padding:1px 6px}
.ktab.on{background:#fff;color:#463C34;box-shadow:0 2px 6px rgba(160,140,115,.16)}
.ktab.on b{background:#E7F6E8;color:#4E9A66}
.ktab.on.eve b{background:#F3E9FB;color:#7B5AA6}
.ktab .kth{font-size:9px;line-height:1}
.rts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rt{display:flex;align-items:center;gap:7px;height:var(--rt-h);background:#FBF7F0;border:1px solid #F2E9DB;
  border-radius:11px;padding:0 8px}
.rt.done{background:#F1FAF3;border-color:#DCEEDE}
.rchk{width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:2px solid #DCCEBB;background:#fff;
  display:grid;place-items:center;font-size:10px;color:#fff;cursor:pointer;padding:0}
.rt.done .rchk{background:#7FC79A;border-color:#7FC79A}
.rtt{font-size:11.5px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt.done .rtt{color:#A4B7A7;text-decoration:line-through}
.wbmark{margin-left:auto;flex:0 0 auto;font-size:8.5px;font-weight:900;color:#A9762F;background:#FFF5D8;
  border:1px solid #F0DFA8;border-radius:999px;padding:1px 6px;white-space:nowrap}
.rt .wbmark + .rtx{margin-left:0}
.rtx{margin-left:auto;border:0;background:transparent;color:#D6C6B3;font-size:10px;cursor:pointer;padding:2px 3px}
.rt-add{display:flex;gap:4px;margin-top:5px}
.rt-add input{flex:1;min-width:0;height:var(--inp-h);border:1px dashed #DFD0BB;background:#FFFDF8;border-radius:10px;
  padding:0 8px;font-size:11px;font-family:inherit;color:var(--ink)}
.rt-add input::placeholder{color:#C6B7A4}
.addb{width:var(--inp-h);height:var(--inp-h);flex:0 0 auto;border:1px solid #E4D6C1;background:#fff;border-radius:10px;
  font-size:14px;font-weight:900;color:#8B7A63;cursor:pointer;line-height:1}

/* ---------- 치즈집 청소 ---------- */
.clean-t{font-size:11px;color:var(--sub);margin-bottom:6px}
.clean-btns{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:5px;height:30px;border:1px solid #E7DCCB;background:#fff;border-radius:11px;
  padding:0 12px;font-size:12px;font-weight:900;color:#6F6252;cursor:pointer}
.cbtn.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 4px 10px rgba(95,169,122,.3)}
.cbtn .n{font-size:9.5px;font-weight:900;background:#F3EADB;color:#8A7C6B;border-radius:999px;padding:1px 6px}
.cbtn.on .n{background:rgba(255,255,255,.3);color:#fff}
.clean-cnt{font-size:10.5px;color:var(--sub);margin-top:7px}
.clean-cnt b{color:#5C8F6D}
.clean-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.clean-log{font-size:9px;color:var(--faint);margin-top:5px;line-height:1.35}
.undo{border:1px solid #EADFCB;background:#FFF8EA;border-radius:9px;padding:4px 8px;font-size:10px;font-weight:800;
  color:#8B7A63;cursor:pointer}
.today-rec{font-size:10px;color:var(--faint);font-weight:800}
.today-rec.on{color:#5C8F6D}
/* 날짜 선택 + 기록 목록 (지난 날짜도 추가·수정·삭제) */
.clean-nav{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.cnav{width:26px;height:28px;flex:0 0 26px;border:1px solid #E7DCCB;background:#fff;border-radius:9px;
  font-size:10px;font-weight:900;color:#8B7A63;cursor:pointer;line-height:1;padding:0}
.cnav:disabled{opacity:.3;cursor:default}
.cdate{flex:1 1 auto;min-width:0;height:28px;border:1px solid #E7DCCB;background:#FFFDF8;border-radius:9px;
  padding:0 5px;font:inherit;font-size:11.5px;font-weight:800;color:#5C5044;letter-spacing:-.2px}
.cdate::-webkit-calendar-picker-indicator{opacity:.45;width:13px;height:13px;padding:0}
.cnow{flex:0 0 auto;height:28px;border:1px solid #CFE4D5;background:#EFF9F1;border-radius:9px;padding:0 8px;
  font-size:10.5px;font-weight:900;color:#4E8F65;cursor:pointer;white-space:nowrap}
.cl-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cl-empty{font-size:9.5px;color:var(--faint);margin-top:5px}
.cl-chip{display:inline-flex;align-items:center;background:#F7F2E9;border:1px solid #EEE3D2;border-radius:999px;overflow:hidden}
.cl-chip .cj{border:0;background:transparent;cursor:pointer;padding:2px 1px 2px 7px;
  font-size:9.5px;font-weight:800;color:#7A6C5C;white-space:nowrap;letter-spacing:-.2px}
.cl-chip .cj:active{color:#4E8F65}
.cl-chip .cd{border:0;background:transparent;cursor:pointer;padding:1px 6px 1px 3px;
  font-size:11px;line-height:1.1;color:#CBBBA6}
.cl-chip .cd:active{color:#C4654A}
.cl-more{display:flex;align-items:center;gap:6px;margin-top:5px}
.cl-toggle{border:1px solid #EADFCB;background:#FFF8EA;border-radius:9px;padding:2px 7px;
  font-size:9.5px;font-weight:800;color:#8B7A63;cursor:pointer}
@media (min-width:1024px){
  .clean-nav{gap:4px;margin-bottom:5px}
  .cnav{width:20px;height:20px;flex-basis:20px;font-size:8px;border-radius:7px}
  .cdate{height:20px;font-size:9.5px;border-radius:7px;padding:0 4px}
  .cnow{height:20px;font-size:8.5px;padding:0 6px;border-radius:7px}
  .cl-list{gap:3px;margin-top:4px}
  .cl-chip .cj{font-size:8px;padding:1px 1px 1px 5px}
  .cl-chip .cd{font-size:9px;padding:1px 4px 1px 2px}
  .cl-toggle{font-size:8px;padding:1px 5px}
  .cl-empty{font-size:8.5px;margin-top:4px}
}

/* ---------- 보상 도장판 ---------- */
.rnote{font-size:9.5px;color:#A9752F;font-weight:800;background:#FFF8E6;border:1px solid #F3E7C9;
  border-radius:9px;padding:3px 7px;margin-bottom:7px;line-height:1.35}
.rwk{margin-bottom:8px}
.rwk:last-child{margin-bottom:0}
.rwk-h{display:flex;align-items:center;gap:5px;font-size:11.5px}
.rwk-h b{letter-spacing:-.4px}
.rwk-m{margin-left:auto;font-size:9.5px;color:var(--sub);font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:4px}
.st{height:var(--st-h);border-radius:5px;background:#F8F2E9;border:1px dashed #EADDC8;display:grid;place-items:center;
  font-size:8px;color:#CBBBA6;font-weight:800}
.st.on{background:linear-gradient(160deg,#FFF2C4,#FFE08A);border:1px solid #F1CE6E;color:#8A6420}
.st.miss{background:#FBEAEA;border:1px solid #F3D6D6;color:#C58A8A}
.st.today{box-shadow:0 0 0 2px #8FC7A2;border-style:solid;color:#5C8F6D}

/* ---------- 우편함 ---------- */
.mrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.lab{font-size:9.5px;font-weight:900;color:var(--faint);white-space:nowrap;min-width:34px}
.chip{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:var(--chip-h);padding:0 10px;
  font-size:10.5px;font-weight:800;color:#8B7A63;cursor:pointer;white-space:nowrap}
.chip.on{background:#5FA97A;border-color:#5FA97A;color:#fff}
.chip.on.pink{background:#E28DA4;border-color:#E28DA4}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:2px 0 6px}
.qbtn{border:1px solid #EFE1CB;background:#FFFBF3;border-radius:10px;height:29px;font-size:10.5px;font-weight:800;
  color:#7A6A58;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.qbtn:active{transform:scale(.97)}
.crow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.cbtn2{border:1px solid #DCE9F6;background:#F4FAFF;border-radius:999px;height:var(--chip-h);padding:0 8px;
  font-size:10.5px;font-weight:800;color:#4C7FA8;cursor:pointer;white-space:nowrap}
.cbtn2.now{background:#5EA8DE;border-color:#5EA8DE;color:#fff}
.cbtn2.on{background:#5EA8DE;border-color:#5EA8DE;color:#fff}
.tag{border:1px solid #F0DCC8;background:#fff;border-radius:999px;height:var(--chip-h);padding:0 9px;
  font-size:10.5px;font-weight:800;color:#A9744E;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px}
.tag:active{transform:scale(.97)}
.tag.on{background:linear-gradient(160deg,#FFF3DE,#FFEBD2);border-color:#EDCB9B;color:#A2632A;
  box-shadow:0 2px 7px rgba(214,166,102,.22)}
.tag .v{color:#fff;background:#D79A4E;font-weight:900;font-size:9.5px;border-radius:999px;
  padding:1px 5px;min-width:14px;text-align:center}
/* ---------- 오늘 먹고 싶은 음식 — 한 줄 바 ---------- */
.foodbar{padding:7px var(--pad)}
.fb-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.fb-lab{font-size:11.5px;font-weight:900;letter-spacing:-.5px;white-space:nowrap}
.fb-in{flex:1 1 62px;min-width:56px;max-width:120px}
.fb-add{flex:0 0 auto;width:var(--chip-h);height:var(--chip-h);border:1px solid #D8EADD;background:#F4FBF5;
  border-radius:999px;font-size:13px;font-weight:900;line-height:1;color:#5FA97A;cursor:pointer;padding:0}
.fb-add:active{transform:scale(.94)}
.fb-reset{flex:0 0 auto;border:1px solid #EFE2CE;background:#FFF9EE;border-radius:999px;
  height:calc(var(--chip-h) - 3px);padding:0 8px;font-size:9.5px;font-weight:800;color:#A99A86;
  cursor:pointer;white-space:nowrap}
.fb-reset:active{transform:scale(.96)}
/* ---------- 오늘의 공부 체크리스트 ---------- */
.st-badge{margin-left:2px;font-size:9.5px;font-weight:900;color:#7B5AA6;background:#F5ECFB;
  border:1px solid #E9D9F6;border-radius:999px;padding:2px 8px;white-space:nowrap;letter-spacing:0}
.st-kids{display:flex;gap:3px;margin-left:auto}
.skk{height:22px;border:1px solid #E7DCCB;background:#fff;border-radius:999px;padding:0 10px;
  font-size:10.5px;font-weight:900;color:#8B7A63;cursor:pointer}
.skk.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 3px 8px rgba(95,169,122,.25)}
.st-prog{height:4px;border-radius:999px;background:#F3EDE3;overflow:hidden;margin:0 0 7px}
.st-prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9BD0B6,#5FA97A);transition:width .25s}
.st-body{display:block}
.st-empty{font-size:10.5px;font-weight:800;color:var(--faint);text-align:center;padding:9px 6px;
  background:#FFFCF6;border:1px dashed #EFE3D2;border-radius:12px}
.st-list{display:flex;flex-direction:column;gap:4px}
.st-list .rt .rtt{flex:1 1 auto}
.st-sub{flex:0 0 auto;font-size:8.5px;font-weight:900;color:#5E86B5;background:#EAF2FB;
  border:1px solid #D9E7F7;border-radius:999px;padding:1px 6px;white-space:nowrap}
.st-tools{margin-top:6px}
.st-subrow{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.st-editbtn{margin-left:auto;border:1px solid #E7DCCB;background:#FFF9EE;border-radius:999px;height:22px;
  padding:0 8px;font-size:9.5px;font-weight:800;color:#A99A86;cursor:pointer;white-space:nowrap}
.st-editbtn.on{background:#F5ECFB;border-color:#E2CFF2;color:#7B5AA6}
.edchip{display:inline-flex;align-items:center;gap:1px;height:var(--chip-h);border:1px dashed #D9C9F0;
  background:#FBF6FF;border-radius:999px;padding:0 4px 0 9px;font-size:10.5px;font-weight:800;color:#7B5AA6}
.chipx{border:0;background:transparent;color:#B9A6D2;font-size:9px;line-height:1;cursor:pointer;padding:2px 3px}
.chipx.del{color:#D8B4C4}

.presets{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:5px;
  padding:5px 6px;background:#FAFCFF;border:1px solid #EDF3FA;border-radius:12px}
.presets .lab{font-size:9px;font-weight:900;color:#9DB6CE;white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:2px;height:calc(var(--chip-h) - 2px);
  border:1px solid #D6E6F6;background:#F2F8FE;border-radius:999px;padding:0 9px;
  font-size:10.5px;font-weight:800;color:#4C7FA8;cursor:pointer;white-space:nowrap}
.pchip:active{transform:scale(.97)}
.pempty{font-size:9px;color:#B4C6D8;font-weight:700}
.presets .minp{height:calc(var(--chip-h) - 2px);max-width:110px;min-width:64px;font-size:10px}
.presets .fb-add{width:calc(var(--chip-h) - 2px);height:calc(var(--chip-h) - 2px);font-size:12px}
.st-add{display:flex;gap:4px;margin-top:6px}
.st-add input{flex:1;min-width:0;height:var(--inp-h);border:1px dashed #DFD0BB;background:#FFFDF8;
  border-radius:10px;padding:0 8px;font-size:11px;font-family:inherit;color:var(--ink)}
.st-add input::placeholder{color:#C6B7A4}
.st-plus{flex:0 0 auto;height:var(--inp-h);border:1px solid var(--mintd);background:var(--mintd);color:#fff;
  border-radius:10px;padding:0 11px;font-size:11px;font-weight:900;cursor:pointer;
  box-shadow:0 3px 8px rgba(95,169,122,.24)}
.st-plus:active{transform:scale(.97)}
/* ---------- 윤·봄 프로필 카드 ---------- */
.kids2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.prof{padding:9px 9px 8px;cursor:pointer;transition:box-shadow .15s,transform .12s}
.prof:active{transform:scale(.985)}
.prof.on{box-shadow:0 0 0 2px #8FC7A2 inset,var(--shadow)}
.prof .prof-top{display:flex;align-items:center;gap:7px}
.prof-ava{width:48px;height:48px;flex:0 0 48px;border-radius:16px;background:linear-gradient(160deg,#FFF7E9,#EFF9F2);
  border:1px solid #F0E6D6;display:grid;place-items:center;overflow:hidden}
.prof-ava svg{width:34px;height:46px;display:block}
.prof-id{min-width:0;flex:1}
.prof-name{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:900;letter-spacing:-.5px;flex-wrap:wrap}
.prof-sub{display:flex;gap:4px;margin-top:2px;font-size:9.5px;font-weight:800;color:#A2937F;flex-wrap:wrap}
.prof-sub .pms{padding:1px 5px;border-radius:999px;background:#F7F1E7}
.prof-sub .pms.on{background:#E4F5E9;color:#4E8F63}
.prof .kdots{margin:7px 0 0;gap:3px}
.prof .kdot{height:15px;border-radius:5px;font-size:8px}
.prof-foot{display:flex;align-items:center;gap:4px;margin-top:6px}
.prof-meta{font-size:8.5px;font-weight:800;color:#B0A392;white-space:nowrap}
.prof-edit{margin-left:auto;border:1px solid #DFEAF8;background:#F4F9FF;color:#5E86B5;border-radius:999px;
  padding:2px 7px;font-size:9px;font-weight:900;cursor:pointer;white-space:nowrap}
.prof-edit:active{transform:scale(.96)}
/* ---------- 선택한 아이 상세 ---------- */
.kd[hidden]{display:none!important}
.kd-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.kd-ava{width:22px;height:28px;flex:0 0 22px;display:grid;place-items:center}
.kd-ava svg{width:18px;height:26px;display:block}
.kd-title{font-size:12.5px;font-weight:900;letter-spacing:-.4px}
.kd-hf{font-size:10px}
.kd-fold{margin-left:auto;border:1px solid #EADFCB;background:#FFF8EA;border-radius:999px;padding:3px 9px;
  font-size:9.5px;font-weight:800;color:#8B7A63;cursor:pointer}
.kd-grid{display:block}
.kd-col{min-width:0}
.kd-col + .kd-col{margin-top:9px}
/* ---------- 다가오는 일정 ---------- */
.cal-wrap{display:block}
.cal-l{min-width:0}
.cal-r{margin-top:9px}
.uplist{display:flex;flex-direction:column;gap:4px}
.upitem{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid #F0E7D7;
  background:#FFFDF8;border-radius:11px;padding:5px 8px;cursor:pointer;font:inherit}
.upitem.today{background:#FFF9EA;border-color:#F2E2BC}
.upico{font-size:12px;flex:0 0 auto}
.upbody{min-width:0;flex:1;display:flex;flex-direction:column}
.uptx{font-size:10.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updt{font-size:8.5px;color:#B0A392;font-weight:700}
.upbadge{flex:0 0 auto;font-size:8.5px;font-weight:900;color:#4C7FA8;background:#EAF2FB;border-radius:999px;padding:1px 6px}
.upitem.today .upbadge{background:#FFE9B8;color:#A9801F}
.upempty{font-size:9.5px;color:var(--faint);font-weight:700;text-align:center;padding:10px 6px;
  background:#FFFCF6;border:1px dashed #EEE2D0;border-radius:11px;line-height:1.5}
/* ---------- 캐릭터 꾸미기 시트 ---------- */
.av-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.av-prev{width:112px;height:150px;flex:0 0 112px;border-radius:20px;background:linear-gradient(160deg,#FFF7E9,#EFF9F2);
  border:1px solid #F0E6D6;display:grid;place-items:center}
.av-prev svg{width:98px;height:140px;display:block}
.av-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.av-txt b{font-size:13px}
.av-txt small{font-size:10px;color:var(--sub);font-weight:700}
.av-tip{font-size:9px;font-weight:800;color:#A99F92;background:#FFF6E9;border:1px solid #F3E6D2;
  border-radius:999px;padding:2px 8px;align-self:flex-start;margin-top:3px}
.av-tabs{display:flex;gap:4px;margin:4px 0 2px}
.avtab{flex:1;height:30px;border:1px solid #E7DCCB;background:#FFFDF8;border-radius:10px;
  font-size:10px;font-weight:800;color:#8B7A63;cursor:pointer;white-space:nowrap;padding:0 2px}
.avtab.on{background:#F5ECFB;border-color:#E2CFF2;color:#7B5AA6;font-weight:900;
  box-shadow:0 2px 6px rgba(150,120,190,.16)}
.av-sec{margin-top:8px}
.av-lab{font-size:10px;font-weight:900;color:#8B7A63;margin-bottom:4px}
.av-opts{display:flex;flex-wrap:wrap;gap:4px}
.avopt{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:26px;padding:0 10px;
  font-size:10.5px;font-weight:800;color:#7A6A58;cursor:pointer;white-space:nowrap}
.avopt.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 3px 8px rgba(95,169,122,.25)}
.avsw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #E3D6C6;cursor:pointer}
.avsw.on{box-shadow:0 0 0 2px #5FA97A;transform:scale(1.06)}
.av-foot{display:flex;gap:6px;margin-top:12px}
.av-save{flex:1;height:40px;border:0;border-radius:12px;background:var(--mintd);color:#fff;font-size:13px;
  font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(95,169,122,.28)}
.av-cancel{flex:0 0 auto;height:40px;border:1px solid #E7DCCB;background:#fff;border-radius:12px;padding:0 16px;
  font-size:12px;font-weight:800;color:#8B7A63;cursor:pointer}
.minp{flex:1;min-width:54px;height:var(--chip-h);border:1px dashed #E4D3BE;border-radius:999px;padding:0 9px;
  font-size:10.5px;font-family:inherit;background:#fff;color:var(--ink)}
.send-row{display:flex;gap:5px;margin-top:2px}
.send-row input{flex:1;min-width:0;height:var(--inp-h);border:1px solid #E8DCC9;border-radius:11px;padding:0 10px;
  font-size:11.5px;font-family:inherit;background:#FFFDF8;color:var(--ink)}
.send-row input::placeholder{color:#C6B7A4}
.sbtn{flex:0 0 auto;height:var(--inp-h);border:1px solid var(--mintd);background:var(--mintd);color:#fff;border-radius:11px;
  padding:0 12px;font-size:11.5px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(95,169,122,.28)}
.mail-log{max-height:112px;overflow:auto;margin-top:7px;border-top:1px dashed #F0E6D8;padding-top:6px;
  display:flex;flex-direction:column;gap:3px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 78%,transparent 100%)}
.mail-log::-webkit-scrollbar{display:none}
.mm{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.3;min-width:0}
.mfrom{font-weight:900;color:#7A6A58;white-space:nowrap}
.arw{color:#CDBFAC}
.mto{font-weight:800;color:#A2937F;white-space:nowrap}
.mtx{color:#6F6252;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mts{color:#C2B5A4;white-space:nowrap;font-variant-numeric:tabular-nums}
.mempty{font-size:10px;color:var(--faint)}

/* ---------- 이거 사주세요 ---------- */
.wdesc{font-size:10.5px;color:var(--sub);margin-bottom:6px}
.winput{width:100%;height:var(--inp-h);border:1px solid #E8DCC9;border-radius:11px;padding:0 10px;font-size:11.5px;
  font-family:inherit;background:#FFFDF8;color:var(--ink)}
.winput::placeholder{color:#C6B7A4}
.wrow{display:flex;gap:5px;margin-top:5px}
.wrow .winput{flex:1;min-width:0}
.wlist{margin-top:7px;display:flex;flex-direction:column;gap:4px;max-height:132px;overflow:auto;scrollbar-width:none}
.wlist::-webkit-scrollbar{display:none}
.witem{display:flex;align-items:center;gap:6px;background:#FBF7F0;border:1px solid #F2E9DB;border-radius:11px;padding:5px 7px}
.witem.done{background:#F3FAF4;border-color:#DDEDDE}
.wchk{width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:2px solid #DCCEBB;background:#fff;display:grid;
  place-items:center;font-size:10px;color:#fff;cursor:pointer;padding:0}
.witem.done .wchk{background:#7FC79A;border-color:#7FC79A}
.wbody{min-width:0;flex:1}
.wname{font-size:11.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem.done .wname{color:#A4B7A7;text-decoration:line-through}
.wmeta{font-size:9.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wprice{color:#B5834A;font-weight:800}
.who{font-size:9px;font-weight:900;border-radius:999px;padding:1px 6px;background:#EFE8DA;color:#8A7C6B;white-space:nowrap}
.who.k1{background:#EAF7EC;color:#4E8F63}
.who.k2{background:#FFF1E2;color:#B57F42}
.who.mom{background:#FFEAF1;color:#B8637F}
.who.dad{background:#EAF3FD;color:#4C7FA8}
.wdel{margin-left:auto;border:0;background:transparent;color:#D6C6B3;font-size:11px;cursor:pointer;padding:2px 3px}

/* ---------- 달력 · 일정 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cw{text-align:center;font-size:8.5px;font-weight:900;color:#B4A797;padding-bottom:2px}
.cw.sun{color:#D09A93}
.cw.sat{color:#93AFC9}
.cd{height:19px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#7A6E5F;border-radius:6px}
.cd.blank{background:transparent}
.cd.sun{color:#C4654A}
.cd.sat{color:#5B87B0}
.cd.today{background:#FFF3C9;box-shadow:0 0 0 2px #F4DE9B inset;color:#A9801F;font-weight:900}
.sched{margin-top:7px;border-top:1px dashed #F0E6D8;padding-top:6px}
.sh{font-size:10px;font-weight:900;color:#A2937F;margin-bottom:4px}
.si{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
.schk{width:16px;height:16px;flex:0 0 16px;border-radius:5px;border:2px solid #DCCEBB;background:#fff;display:grid;
  place-items:center;font-size:9px;color:#fff;cursor:pointer;padding:0}
.si.done .schk{background:#7FC79A;border-color:#7FC79A}
.si.done .stx{color:#A4B7A7;text-decoration:line-through}
.stx{letter-spacing:-.3px}
.sadd{display:flex;gap:4px;margin-top:4px}
.sadd input{flex:1;min-width:0;height:26px;border:1px dashed #DFD0BB;border-radius:9px;padding:0 8px;font-size:10.5px;
  font-family:inherit;background:#FFFDF8;color:var(--ink)}

/* ---------- 밀림 체크 ---------- */
.wk{width:100%;border-collapse:separate;border-spacing:0 2px;table-layout:fixed}
.wk th{font-size:9px;color:#A99C8C;font-weight:800;padding-bottom:2px;text-align:center}
.wk th .dnum{font-size:8px;color:#C2B5A4;display:block}
.wk td{text-align:center;padding:0}
.wk td.name{text-align:left;font-size:10.5px;font-weight:900;color:#6F6357;padding-left:2px}
.cell{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;font-size:9.5px;font-weight:800}
.c-done{background:#E7F6E8;color:#4E9A66}
.c-miss{background:#FCE7E4;color:#C4654A}
.c-today{background:#FFF3C9;color:#A9801F;box-shadow:0 0 0 2px #F4DE9B inset}
.c-void{background:#F7F1E7;color:#DED3C2}
.dday{display:flex;align-items:center;gap:6px;background:var(--sky);border:1px solid #D6E8F8;border-radius:10px;
  padding:4px 9px;margin:6px 0;font-size:10px;font-weight:900;color:#3E7CB1}
.dday .rest{margin-left:auto;font-weight:700;color:#7C9DBA;font-size:9.5px}
.pen{background:#FFF7F3;border:1px dashed #F3D6C8;border-radius:11px;padding:6px 8px}
.pen-t{font-size:10px;font-weight:900;color:#B7603F;line-height:1.55}
.pen-star{display:inline-block;margin:2px 0;padding:1px 7px;border-radius:999px;background:#FFECAE;border:1px solid #EBCD80;color:#8F5C08;line-height:1.35}
.pen-li{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.pen-li .who2{font-size:10.5px;font-weight:900;color:#8A5B45;min-width:16px}
.pen-li .cnt2{font-size:9px;font-weight:900;color:#fff;background:#E08E6B;border-radius:999px;padding:1px 6px}
.pen-li input{flex:1;min-width:70px;height:24px;border:1px solid #EFDACF;border-radius:8px;padding:0 7px;font-size:10px;
  background:#fff;font-family:inherit;color:var(--ink)}
.pen-ok{font-size:9.5px;color:#7E9A82;margin-top:5px;font-weight:800}
.pen-log{font-size:9px;color:#A0897C;margin-top:4px;line-height:1.35}

/* ---------- 타이머 ---------- */
.chips2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tchip{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:24px;padding:0 9px;font-size:10px;
  font-weight:800;color:#8B7A63;cursor:pointer}
.tchip.on{background:#5FA97A;border-color:#5FA97A;color:#fff}
.tin{width:46px;height:24px;border:1px solid #E7DCCB;border-radius:8px;padding:0 5px;font-size:10px;font-family:inherit;
  text-align:center;color:var(--ink)}
.tface{display:flex;align-items:baseline;justify-content:center;gap:8px;background:linear-gradient(160deg,#F5FAF5,#FFFAEE);
  border:1px dashed #DDEBDD;border-radius:12px;padding:5px 0;margin:6px 0}
.ttime{font-size:26px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.05}
.tsub{font-size:9px;color:#A2937F;font-weight:800}
.tbtns{display:flex;gap:5px}
.tbtns .btn{flex:1}
.btn{border:1px solid #E6D9C6;background:#fff;border-radius:10px;height:30px;padding:0 10px;font-size:11px;
  font-weight:900;color:#6E5E4C;cursor:pointer;font-family:inherit;letter-spacing:-.2px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--mintd);border-color:var(--mintd);color:#fff;box-shadow:0 3px 9px rgba(127,199,154,.35)}
.btn.ghost{background:#FFF8EA;border-color:#EFE1CB;color:#8B7A63}
.btn.sm{height:26px;font-size:10px}
.alarm{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;background:#F8F5FF;border:1px solid #E9E2F8;
  border-radius:10px;padding:4px 8px;font-size:10px;font-weight:800;color:#6B5E8A}
.alarm input[type=time]{border:1px solid #DED6F3;border-radius:8px;height:24px;padding:0 5px;font-size:10px;
  font-family:inherit;background:#fff;color:var(--ink);margin-left:auto}
.alarm label{display:flex;align-items:center;gap:3px}

/* ---------- 미션 ---------- */
.mbox{background:linear-gradient(120deg,#FFF3E4,#FFF9EE);border:1px solid #F6E4CD;
  border-radius:12px;padding:7px 9px}
.mbox.done{background:linear-gradient(120deg,#EAF8EC,#F7FCF5);border-color:#D9ECDC}
.mi-top{display:flex;align-items:flex-start;gap:6px}
.mi-e{font-size:19px;line-height:1.1}
.mi-t{font-size:11.5px;font-weight:900;line-height:1.3;letter-spacing:-.3px}
.mi-btns{display:flex;gap:4px;margin-top:6px}
.mi-btns .btn{flex:1;height:24px;padding:0 4px;font-size:9.5px;white-space:nowrap}

/* ---------- 토스트 · 축하 ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:rgba(70,60,52,.94);color:#fff;
  font-size:12px;font-weight:700;padding:9px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s ease;
  z-index:90;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.cf{position:absolute;top:-14px;width:8px;height:11px;border-radius:2px;opacity:.95;animation:fall 2.2s linear forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,0),110vh) rotate(540deg)}}
.foot{text-align:center;font-size:9.5px;color:#C3B6A6;margin:12px 0 0;line-height:1.5}
.foot-btns{display:inline-flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;justify-content:center}

/* ---------- 퇴근 시간 직접 입력 미니 시트 ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.sheet-bd{position:absolute;inset:0;background:rgba(60,50,42,.32)}
.sheet-card{position:relative;width:100%;max-width:430px;background:#FFFDF9;border-radius:22px 22px 0 0;
  padding:14px 14px 18px;box-shadow:0 -6px 24px rgba(120,100,80,.2);max-height:86vh;overflow:auto}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h b{font-size:14px}
.sheet-h button{margin-left:auto;border:0;background:#F4EEE4;border-radius:9px;width:26px;height:26px;cursor:pointer;
  font-size:11px;color:#8A7C6B}
.sg-t{font-size:10.5px;font-weight:900;color:var(--faint);margin:8px 0 5px}
.sg-t:first-child{margin-top:0}
.sg-list{display:flex;flex-wrap:wrap;gap:5px}
.opt{display:flex;align-items:center;gap:5px;border:1px solid #DCE9F6;background:#F4FAFF;border-radius:11px;
  padding:8px 11px;font-size:11.5px;font-weight:800;color:#4C7FA8;cursor:pointer}
.opt.on{background:#5EA8DE;border-color:#5EA8DE;color:#fff}
.sheet-row{display:flex;align-items:center;gap:5px;margin-top:3px}
.sheet-row input[type=time]{flex:1;min-width:0;height:32px;border:1px solid #E7DCCB;border-radius:10px;padding:0 8px;
  font-size:11.5px;font-family:inherit;background:#fff;color:var(--ink)}

@media (max-width:1023px){
  .wx-desc{display:none}
  .wx-air{font-size:9px}
  .cbtn2{font-size:10px;padding:0 7px}
}
/* ============================================================
   태블릿 · PC 가로 (1024px 이상) — 한 화면 대시보드 그리드
   ============================================================ */
@media (min-width:1024px){
  :root{
    --gap:7px; --pad:7px; --r:12px;
    --h2:11px; --rt-h:17px; --chip-h:19px; --inp-h:23px; --mini:8.5px; --st-h:13px; --fs:10.8px;

<!-- ============================================================

<script>
/* ============================================================

    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = [];
  for (var i=0;i<ascii.length;i++){
    var c = ascii.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0|(c>>6), 0x80|(c&63));
    else if (c < 0xd800 || c >= 0xe000) bytes.push(0xe0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63));
    else {
      var c2 = ascii.charCodeAt(++i);
      var cp = 0x10000 + ((c & 0x3ff) << 10) + (c2 & 0x3ff);
      bytes.push(0xf0|(cp>>18), 0x80|((cp>>12)&63), 0x80|((cp>>6)&63), 0x80|(cp&63));
    }
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  var hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;

    for (var t=0;t<16;t++)
      w[t] = (bytes[off+t*4]<<24) | (bytes[off+t*4+1]<<16) | (bytes[off+t*4+2]<<8) | bytes[off+t*4+3];
    for (t=16;t<64;t++){
      var s0 = rr(w[t-15],7) ^ rr(w[t-15],18) ^ (w[t-15]>>>3);
      var s1 = rr(w[t-2],17) ^ rr(w[t-2],19) ^ (w[t-2]>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    var a=H[0],b=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (t=0;t<64;t++){
      var S1 = rr(e,6)^rr(e,11)^rr(e,25);
      var ch = (e&f)^((~e)&g);
      var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      var S0 = rr(a,2)^rr(a,13)^rr(a,22);
      var maj = (a&b)^(a&cc)^(b&cc);
      var t2 = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=cc; cc=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+cc)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;

  for (var k=0;k<8;k++){ out += ('00000000'+((H[k]>>>0).toString(16))).slice(-8); }

function sha256Hex(str){
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest && window.TextEncoder){
      var buf = new TextEncoder().encode(str);
      return window.crypto.subtle.digest('SHA-256', buf).then(function(d){
        var b = new Uint8Array(d), out = '';
        for (var i=0;i<b.length;i++) out += ('0'+b[i].toString(16)).slice(-2);
        return out;
      });
    }
  } catch(e){ /* 아래 폴백으로 */ }
  return Promise.resolve(sha256Sync(str));
}
function pinDigest(pin, salt){
  return sha256Hex('family-dashboard|v' + CONFIG.VERSION + '|' + (salt || '') + '|' + String(pin));
}

function loadScriptOnce(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function(){ res(true); };
    s.onerror = function(){ rej(new Error('script-load-failed: ' + src)); };
    document.head.appendChild(s);
  });
}
function findIndexById(arr, key){
  var n = String(key), i;
  for (i=0;i<arr.length;i++){ if (arr[i] && String(arr[i].id) === n) return i; }
  if (/^[0-9]+$/.test(n) && arr[Number(n)] !== undefined) return Number(n);
  return -1;
}
function applyPatch(root, paths){
  Object.keys(paths || {}).forEach(function(p){
    var parts = p.split('/'), o = root, i, key;
    for (i=0;i<parts.length-1;i++){
      key = parts[i];
      if (Array.isArray(o)){                       // 목록(배열) 안으로 들어갈 때는 id 로 찾는다
        var ix = findIndexById(o, key);
        if (ix < 0){ o.push({}); ix = o.length - 1; }
        o = o[ix];
        continue;
      }
      if (!o[key] || typeof o[key] !== 'object') o[key] = {};
      o = o[key];
    }
    key = parts[parts.length-1];
    if (Array.isArray(o)){                         // 같은 목록의 다른 항목을 서로 덮지 않도록 id 기준 병합
      var pos = findIndexById(o, key);
      if (paths[p] === null || paths[p] === undefined){ if (pos > -1) o.splice(pos, 1); }
      else if (pos > -1) o[pos] = paths[p];
      else o.push(paths[p]);
      return;
    }
    if (paths[p] === null || paths[p] === undefined) delete o[key];
    else o[key] = paths[p];
  });
  return root;
}
/* before → after 로 바뀐 '잎 경로'만 뽑아낸다 (배열은 id 기준으로 비교) */

    return v;
  }
  if (before === after) return out;
  if (!isObj(before) || !isObj(after)){
    if (JSON.stringify(before) !== JSON.stringify(after)) out[base] = (after === undefined ? null : after);
    return out;
  }
  if (Array.isArray(before) || Array.isArray(after)){
    /* Firebase 는 목록을 0,1,2… 인덱스 키로 저장한다. id 키로 쓰면 항목이 중복되므로
       인덱스 기준으로 바꿔진 자리만 쓴다. (로컬도 findIndexById 가 숫자 키를 인덱스로 받는다) */
    var bi = before || [], ai = after || [], n = Math.max(bi.length, ai.length);
    for (var ai_i = 0; ai_i < n; ai_i++){
      var b = bi[ai_i], a = ai[ai_i], p = base + '/' + ai_i;
      if (a === undefined){ if (b !== undefined) out[p] = null; continue; }
      if (JSON.stringify(b) !== JSON.stringify(a)) out[p] = a;
    }
    return out;
  }
  Object.keys(before).concat(Object.keys(after)).filter(function(v,i,a){ return a.indexOf(v) === i; }).forEach(function(k){
    var b = before[k], a = after[k], p = base ? base + '/' + k : k;
    if (a === undefined){ if (b !== undefined) out[p] = null; return; }
    if (!isObj(a) || !isObj(b)){
      if (JSON.stringify(a) !== JSON.stringify(b)) out[p] = a;
    } else {
      diffPaths(b, a, p, out);
    }
  });
  return out;
}

const LocalAdapter = {
  kind: 'local',
  root: null,
  subs: [],
  bc: null,
  openChannel: function(){
    if (this.bc || typeof BroadcastChannel === 'undefined') return;
    try {
      var self = this;
      this.bc = new BroadcastChannel(CONFIG.BCAST);
      this.bc.onmessage = function(ev){
        var d = ev.data || {};
        if (d.t === 'patch' && d.paths){
          if (!self.root) self.root = { auth:{}, config:null, state:null };
          applyPatch(self.root, d.paths);
          self.subs.forEach(function(fn){ try { fn(self.root, 'remote'); } catch(e){} });
        }
      };
    } catch(e){}
  },
  load: function(){
    var self = this;
    this.openChannel();
    return new Promise(function(res){
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem(CONFIG.LOCAL_KEY) || 'null'); } catch(e){ raw = null; }
      self.root = raw && typeof raw === 'object' ? raw : null;
      res(self.root);
    });
  },
  patch: function(paths){
    this.openChannel();
    if (!this.root) this.root = { auth:{}, config:null, state:null };
    applyPatch(this.root, paths);
    try { localStorage.setItem(CONFIG.LOCAL_KEY, JSON.stringify(this.root)); } catch(e){}
    if (this.bc){ try { this.bc.postMessage({ t:'patch', paths:paths }); } catch(e){} }
    return Promise.resolve(true);
  },
  subscribe: function(fn){
    if (this.subs.indexOf(fn) < 0) this.subs.push(fn);
    this.openChannel();
  }
};

/* ============================================================
   가족 인증 — Firebase Auth (이메일/비밀번호)
     · 각 기기에서 처음 한 번만 가족 암호를 넣으면 Firebase가 그 기기에 로그인을 기억한다
     · 가족 암호는 이 파일에 없다. 여기서는 가족 계정 아이디로 로그인만 한다
   ============================================================ */
var fbInitPromise = null;
function initFirebaseApp(){
  if (!fbInitPromise) fbInitPromise = (async function(){
    await loadScriptOnce(CONFIG.SDK_APP);
    await loadScriptOnce(CONFIG.SDK_AUTH);
    if (typeof firebase === 'undefined') throw new Error('firebase-sdk-missing');
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    var auth = firebase.auth();
    try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch(e){}
    return auth;
  })();
  return fbInitPromise;
}
/* 현재 로그인된 가족 계정(없으면 null). 저장된 로그인이 복원될 때까지 기다린다 */
function firebaseUserOrNull(){
  return new Promise(function(resolve, reject){
    if (typeof firebase === 'undefined') return reject(new Error('firebase-sdk-missing'));
    var auth = firebase.auth();
    var settled = false, unsub = function(){};
    var done = function(fn, v){ if (settled) return; settled = true; try{ unsub(); }catch(e){} fn(v); };
    unsub = auth.onAuthStateChanged(function(u){ done(resolve, u || null); },
                                   function(err){ done(reject, err); });
  });
}
async function getFamilyUser(){
  await initFirebaseApp();
  return firebaseUserOrNull();
}
async function signInFamily(password){
  var auth = await initFirebaseApp();
  await auth.signInWithEmailAndPassword(CONFIG.FAMILY_ID, String(password));
  return firebaseUserOrNull();
}
function authErrorText(e){
  var c = (e && e.code) || '';
  if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return '가족 암호가 맞지 않아요';
  if (c === 'auth/user-not-found') return '가족 계정을 찾지 못했어요';
  if (c === 'auth/too-many-requests') return '조금 뒤에 다시 시도해 주세요';
  if (c === 'auth/network-request-failed') return '인터넷 연결을 확인해 주세요';
  return '로그인하지 못했어요 · 다시 시도해 주세요';
}

const FirebaseAdapter = {
  kind: 'firebase',
  root: null,
  subs: [],
  ref: null,
  started: false,
  load: async function(){
    await loadScriptOnce(CONFIG.SDK_DB);
    await initFirebaseApp();
    if (typeof firebase === 'undefined') throw new Error('firebase-sdk-missing');
    /* DB 규칙이 가족 계정에만 열려 있으므로, 가족 로그인 세션이 있어야 읽고 쓸 수 있다 */
    var user = await firebaseUserOrNull();
    if (!user) throw new Error('auth-required');
    var db = firebase.database();
    this.ref = db.ref(CONFIG.DB_ROOT);
    try {
      db.ref('.info/connected').on('value', function(s){
        setSync(s && s.val() === true ? 'live' : 'offline');
      });
    } catch(e){}
    setSync('offline', '가족 DB에 연결하는 중…');
    var snap = await this.ref.once('value');
    this.root = snap.val() || null;
    return this.root;
  },
  patch: function(paths){
    if (!this.ref) return Promise.reject(new Error('not-connected'));
    return this.ref.update(paths);
  },
  subscribe: function(fn){
    if (!this.ref) return;
    this.subs.push(fn);
    this.ref.on('value', function(snap){
      try { fn(snap.val() || null, 'remote'); } catch(e){}
    }, function(){ setSync('offline'); });
  }
};

const DB = {

        setSync('offline', 'DB에 연결하지 못해 이 기기에 저장 중이에요');

/* 저장: 같은 틱에 여러 번 바뀌어도 60ms 안에 한 번으로 묶어 보낸다 */
var pendingPaths = null, writeTimer = null, lastLocalWriteAt = 0;
function queueWrite(paths){
  if (!paths || !Object.keys(paths).length) return;
  pendingPaths = Object.assign(pendingPaths || {}, paths);
  lastLocalWriteAt = Date.now();
  if (writeTimer) return;
  writeTimer = setTimeout(flushWrites, 60);
}
function flushWrites(){
  writeTimer = null;
  var p = pendingPaths; pendingPaths = null;
  if (!p || !Object.keys(p).length) return;
  lastLocalWriteAt = Date.now();
  Promise.resolve(DB.patch(p)).catch(function(e){
    console.warn('[dashboard] 저장 실패:', e && e.message);
    if (DB.isRemote()) setSync('offline');
    toast('저장이 잠시 안 됐어요 · 연결되면 다시 맞춰요', 2600);
  });
}
/* state 를 바꾸고, 바뀐 잎 경로만 저장한다 (동시 편집 안전) */
function mutate(fn){
  if (!state) return {};
  var before = JSON.parse(JSON.stringify(state));
  fn(state);
  var paths = diffPaths(before, state, 'state');
  if (Object.keys(paths).length) queueWrite(paths);
  return paths;
}

  } else {
    out.sched = { date: todayKey(), items: normalizeList(sc ? sc.items : [], [], 's').map(function(i){
      return { id: i.id, text: i.text, done:false };
    })};
  }
  /* 날짜별 일정·준비물 (오늘은 sched, 다른 날은 여기) */
  var calMap = {};
  if (r.cal && typeof r.cal === 'object'){
    Object.keys(r.cal).forEach(function(k){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      if (k === todayKey()) return;               // 오늘 몫은 sched 가 정본
      var list = normalizeList(r.cal[k], [], 's');
      if (list.length) calMap[k] = list.map(function(i){ return { id:i.id, text:i.text, done:!!i.done }; });
    });
  }
  out.cal = calMap;
  out.mission = (r.mission && typeof r.mission === 'object' && r.mission.date === todayKey())
    ? { idx: (r.mission.idx | 0), done: !!r.mission.done, date: r.mission.date }
    : { idx: randInt(CFG.missions.length), done:false, date: todayKey() };
  out.timer = Object.assign({}, base.timer, r.timer || {});
  out.alarm = Object.assign({}, base.alarm, r.alarm || {});
  out.hf = Object.assign({}, base.hf, r.hf || {});
  return out;
}

/* ============================================================
   9. 계산
   ============================================================ */
function listOf(id, tab){ return (state && state.kids && state.kids[id] && state.kids[id][tab]) || []; }
function cnt(id, tab){ var l = listOf(id, tab); return { done: l.filter(function(t){ return t.done; }).length, total: l.length }; }
function allDone(id){
  var m = cnt(id,'morning'), e = cnt(id,'evening');
  return m.total > 0 && e.total > 0 && m.done === m.total && e.done === e.total;
}
/* 한 탭(아침·저녁)만 봤을 때 그 탭을 다 했는지 */
function tabDone(id, tab){
  var c = cnt(id, tab);
  return c.total > 0 && c.done === c.total;
}
function currentTab(id){ return (prefs && prefs.tabs && prefs.tabs[id]) || 'morning'; }
function studyDone(id){
  return listOf(id,'evening').some(function(t){ return isWB(t) && t.done; });
}
function dayState(id, key){
  if (key === todayKey()) return studyDone(id) ? 'done' : 'now';
  var d = state.days[key];
  return d ? (d[id] || null) : null;
}
function streakOf(id){
  var n = 0, d = new Date();
  if (!studyDone(id)) d = addDays(d,-1);
  for (var i=0;i<400;i++){
    if (dayState(id, ymd(d)) === 'done'){ n++; d = addDays(d,-1); }
    else break;
  }
  return n;
}
/* 도장판·밀림 체크에서 지난 날짜를 손으로 고친다: 미기록 → done → miss → 미기록 */
function cycleDayState(id, key){
  var cur = (state.days[key] || {})[id] || null;
  var next = !cur ? 'done' : (cur === 'done' ? 'miss' : null);
  mutate(function(s){
    if (!s.days[key]) s.days[key] = {};
    if (next === null) delete s.days[key][id];
    else s.days[key][id] = next;
  });
  return next;
}
/* 오늘 도장 = 저녁 '문제집 풀기' 하나로 결정된다 */
function toggleStudyToday(id){
  var cur = studyDone(id);
  mutate(function(s){
    ((s.kids[id] || {}).evening || []).forEach(function(t){ if (isWB(t)) t.done = !cur; });
  });
  return !cur;
}
/* 날짜별 일정·준비물: 오늘은 state.sched.items, 다른 날은 state.cal[key] */
function schedList(key){
  key = key || calSelKey();
  if (key === todayKey()) return (state.sched && state.sched.items) || [];
  return ((state.cal || {})[key]) || [];
}
function schedSet(key, transform){
  key = key || calSelKey();
  mutate(function(s){
    if (key === todayKey()){
      var cur = (s.sched && s.sched.items) ? s.sched.items : [];
      s.sched = { date: key, items: transform(cur.slice()) || [] };
    } else {
      s.cal = s.cal || {};
      var arr = transform(((s.cal[key] || [])).slice()) || [];
      if (arr.length) s.cal[key] = arr;
      else delete s.cal[key];
    }
  });
}
function schedAddText(key, text){
  text = String(text || '').trim();
  if (!text) return false;
  schedSet(key, function(arr){ return arr.concat([{ id: uid('s'), text: text, done: false }]); });
  return true;
}
function weekDone(id){
  var c = 0;
  weekDates().forEach(function(d){ if (dayState(id, ymd(d)) === 'done') c++; });
  return c;
}
function monthDone(id){
  var t = new Date(), c = 0;
  for (var i=1;i<=t.getDate();i++) if (dayState(id, ymd(new Date(t.getFullYear(), t.getMonth(), i))) === 'done') c++;
  return c;
}
function lastWeekMiss(id){
  var lastMon = addDays(mondayOf(new Date()), -7), c = 0;
  for (var i=0;i<7;i++){
    var k = ymd(addDays(lastMon,i));
    if (state.days[k] && state.days[k][id] === 'miss') c++;
  }
  return c;
}
function sortedClean(){
  return (state.clean || []).slice().sort(function(a,b){
    var d = String(a.date || '').localeCompare(String(b.date || ''));
    return d !== 0 ? d : String(a.id || '').localeCompare(String(b.id || ''));
  });
}
/* 치즈집 청소 — 기기별로 고른 날짜 (동기화하지 않음). null 이면 오늘 */
var cleanDate = null;
var cleanAllMonths = false;          // 기록 목록에 지난달까지 모두 보기
function cleanSelDate(){ return cleanDate || todayKey(); }
function cleanMonthKey(){ return cleanSelDate().slice(0, 7); }
function cleanMd(d){
  var s = String(d || '');
  return s.length >= 10 ? s.slice(5, 7) + '/' + s.slice(8, 10) : s;
}
function parseKey(d){
  var p = String(d || '').split('-').map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}
function cleanOnDate(who, d){
  d = d || cleanSelDate();
  return (state.clean || []).some(function(e){ return e.date === d && e.who === who; });
}
function cleanCount(who, m){
  m = m || cleanMonthKey();
  return (state.clean || []).filter(function(e){ return String(e.date || '').slice(0,7) === m && e.who === who; }).length;
}
function cleanToday(who){ return cleanOnDate(who, todayKey()); }
function cleanSetDate(d){
  var today = todayKey();
  if (typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d)) d = today;
  if (d > today) d = today;                       // 오늘 이후로는 가지 않는다
  cleanDate = (d === today) ? null : d;
  renderClean();
}
function pendingWants(){ return (state.want || []).filter(function(w){ return !w.done; }).length; }

/* 날이 바뀌면 어제 결과를 기록하고 오늘 할 일을 새로 시작 (바뀐 경로만 저장) */
function ensureDay(){
  if (!state) return false;
  var k = todayKey();
  if (state.date === k) return false;
  var prev = state.date;
  mutate(function(s){
    if (prev){
      if (!s.days[prev]) s.days[prev] = {};
      KIDS.forEach(function(id){
        if (!s.days[prev][id]) s.days[prev][id] = studyDone(id) ? 'done' : 'miss';
      });
    }
    KIDS.forEach(function(id){
      ['morning','evening'].forEach(function(tab){
        (s.kids[id][tab] || []).forEach(function(t){ t.done = false; });
      });
      s.hf[id] = '';
      s.hf[id + ':morning'] = '';
      s.hf[id + ':evening'] = '';
    });
    /* 공부 체크리스트는 날마다 새로 (과목·문제집 목록은 그대로 둔다) */
    s.study = s.study || defaultStudy();
    s.study.date = k;
    s.study.items = {};
    s.date = k;
    var carry = (s.sched.items || []).map(function(i){ return { id:i.id, text:i.text, done:false }; });
    var planned = ((s.cal || {})[k] || []).map(function(i){ return { id:i.id, text:i.text, done:false }; });
    planned.forEach(function(p){
      if (!carry.some(function(x){ return x.text === p.text; })) carry.push(p);
    });
    s.sched = { date: k, items: carry };
    s.mission = { idx: randInt(CFG.missions.length), done:false, date:k };
  });
  return true;
}

function renderWeek(){
  var el = $('#week'); if (!el || !state) return;
  var dates = weekDates(), tk = todayKey(), sunday = dates[6];
  var t0 = new Date(); t0.setHours(0,0,0,0);
  var left = Math.round((sunday - t0) / 86400000);

  var head = '<tr><th></th>' + dates.map(function(d){
    return '<th>' + ['일','월','화','수','목','금','토'][d.getDay()] + '<span class="dnum">' + d.getDate() + '</span></th>';
  }).join('') + '</tr>';

  var body = KIDS.map(function(id){
    var tds = dates.map(function(d){
      var k = ymd(d), cls = 'c-void', txt = '';
      if (k === tk){ cls = 'c-today'; txt = studyDone(id) ? '✓' : '·'; }
      else if (k > tk){ cls = 'c-void'; txt = ''; }
      else {
        var s = dayState(id,k);
        if (s === 'done'){ cls = 'c-done'; txt = '✓'; }
        else if (s === 'miss'){ cls = 'c-miss'; txt = '✕'; }
      }
      if (k <= tk){
        return '<td><button class="cell ' + cls + '" type="button" data-act="week-cell" data-k="' + k + '" data-m="' + id + '"'
          + ' aria-label="' + (d.getMonth()+1) + '/' + d.getDate() + ' 수정">' + txt + '</button></td>';
      }
      return '<td><span class="cell ' + cls + '">' + txt + '</span></td>';
    }).join('');
    return '<tr><td class="name">' + esc(FAMILY[id].name) + '</td>' + tds + '</tr>';
  }).join('');

  var warned = KIDS.filter(function(id){ return lastWeekMiss(id) > 0; });
  var clean = KIDS.filter(function(id){ return lastWeekMiss(id) === 0; });
  var penRows = warned.map(function(id){
    return '<div class="pen-li"><span class="who2">' + esc(FAMILY[id].name) + '</span>'
      + '<span class="cnt2">경고 ' + lastWeekMiss(id) + '</span>'
      + '<input data-pen="' + id + '" placeholder="삭제한 앱 (예: 동영상 앱)" value="' + esc(state.penaltyNotes[id] || '') + '">'
      + '<button class="btn sm" type="button" data-act="save-pen" data-m="' + id + '">저장</button>'
      + (state.penaltyNotes[id] ? '<button class="penx" type="button" data-act="pen-del" data-m="' + id + '" aria-label="기록 지우기">×</button>' : '')
      + '</div>';
  }).join('');
  var logs = KIDS.filter(function(id){ return state.penaltyNotes[id]; })
    .map(function(id){ return '<b>' + esc(FAMILY[id].name) + '</b> — ' + esc(state.penaltyNotes[id])
      + '<button class="penx" type="button" data-act="pen-del" data-m="' + id + '" aria-label="기록 지우기">×</button>'; }).join(' · ');

  var lastMon = addDays(mondayOf(new Date()), -7);
  var lastLabel = (lastMon.getMonth()+1) + '/' + lastMon.getDate() + '~' + addDays(lastMon,6).getDate();
  var lastMiss = KIDS.map(function(id){ return { name: FAMILY[id].name, c: lastWeekMiss(id) }; }).filter(function(x){ return x.c > 0; });
  var lastLine = '지난주(' + lastLabel + ') 마감 · '
    + (lastMiss.length ? lastMiss.map(function(x){ return x.name + ' ' + x.c + '일 밀림'; }).join(', ') + ' → 경고' : '모두 지킴 🎉');

  el.innerHTML =
      '<div class="h2">📅 이번 주 밀림 체크 <small>칸을 눌러 수정</small></div>'
    + '<table class="wk"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>'
    + '<div class="dday">⏰ 일(' + sunday.getDate() + '일) 마감 · ' + (left > 0 ? 'D-' + left : 'D-DAY')
    +   '<span class="rest">' + (7-left) + '일 지남</span></div>'
    + '<div class="pen"><div class="pen-t">🚨 하루 밀리면 경고 1개<br>'
    +   '<span class="pen-star">★ 일요일 안에 수정 가능</span><br>'
    +   '일요일까지 경고 1개면 본인 앱 삭제</div>'
    +   penRows
    +   (clean.length ? '<div class="pen-ok">' + clean.map(function(id){ return esc(FAMILY[id].name); }).join(' · ') + ' 경고 0개 🎉</div>' : '')
    +   '<div class="pen-log">' + lastLine + '</div>'
    +   (logs ? '<div class="pen-log">삭제 기록 · ' + logs + '</div>' : '')
    + '</div>';
}

function foodKey(name){ return safeKey(String(name || '').trim()); }
function foodList(){
  var seen = {}, out = [];
  (CFG.foods || []).forEach(function(f){
    var k = foodKey(f);
    if (!f || seen[k]) return;
    seen[k] = 1; out.push({ name: f, key: k });
  });
  Object.keys(state.foods || {}).forEach(function(k){
    if (seen[k]) return;
    seen[k] = 1;
    out.push({ name: k.replace(/_/g, ' '), key: k });
  });
  return out;
}
function foodVotes(){
  var n = 0, f = state.foods || {};
  Object.keys(f).forEach(function(k){ n += Number(f[k]) || 0; });
  return n;
}
function renderFood(){
  var el = $('#foodbar'); if (!el || !state || !prefs) return;
  var votes = state.foods || {};
  var chips = foodList().map(function(x){
    var v = Number(votes[x.key]) || 0;
    return '<button class="tag' + (v ? ' on' : '') + '" type="button" data-act="food" data-food="' + esc(x.name) + '"'
      + ' aria-label="' + esc(x.name + (v ? ' ' + v + '표, 한 표 더' : ' 한 표')) + '">'
      + esc(x.name) + (v ? '<span class="v">' + v + '</span>' : '') + '</button>';
  }).join('');
  el.innerHTML =
      '<div class="fb-row">'
    +   '<span class="fb-lab">🍽️ 오늘 뭐 먹지?</span>'
    +   chips
    +   '<input class="minp fb-in" id="foodInput" placeholder="메뉴 추가" aria-label="먹고 싶은 음식 직접 입력">'
    +   '<button class="fb-add" type="button" data-act="food-custom" aria-label="메뉴 추가">＋</button>'
    +   (foodVotes() > 0 ? '<button class="fb-reset" type="button" data-act="food-reset" aria-label="투표 초기화">↺ 초기화</button>' : '')
    + '</div>';
}
function foodVote(name){
  name = String(name || '').trim();
  if (!name) return;
  var key = foodKey(name);
  if (!key) return;
  mutate(function(s){
    s.foods = s.foods || {};
    s.foods[key] = (Number(s.foods[key]) || 0) + 1;
  });
  renderFood();
  toast('🍽 ' + name + ' 한 표!', 1600);
}
function foodAddFromInput(){
  var inp = $('#foodInput');

  if (!v){ if (inp) inp.focus(); return; }
  foodVote(v);
  var now = $('#foodInput'); if (now) now.value = '';
}

var studyEditMode = false;      // 기기별: 과목·문제집 이름 편집 모드
var studyRename = null;         // { kind:'sub'|'pre', id }
var studyEditId = null;         // 체크리스트 항목 인라인 수정
function studyKidId(){ return activeKid(); }
function studySubjects(){ return (state && state.study && state.study.subjects) || []; }
function studySubject(){
  var subs = studySubjects(), id = prefs && prefs.studySubject;
  var hit = subs.filter(function(s){ return s.id === id; })[0];
  return hit || subs[0] || null;
}
function studyItems(id){ return ((state.study && state.study.items) || {})[id] || []; }
function studyPresets(id, sid){ return (((state.study || {}).presets || {})[id] || {})[sid] || []; }
function studyEnsure(s){
  if (!s.study || typeof s.study !== 'object') s.study = defaultStudy();
  var st = s.study;
  if (!Array.isArray(st.subjects) || !st.subjects.length) st.subjects = defaultStudySubjects();
  if (!st.items || typeof st.items !== 'object') st.items = {};
  if (!st.presets || typeof st.presets !== 'object') st.presets = {};
  st.date = todayKey();
  return st;
}
function studyAdd(name, subjectName){
  var kid = studyKidId();
  name = String(name || '').trim();
  if (!name) return false;
  if (subjectName === undefined) subjectName = (studySubject() || {}).name || '';
  var dup = studyItems(kid).some(function(x){ return !x.done && x.text === name && (x.subjectName || '') === subjectName; });
  if (dup){ toast('이미 오늘 목록에 있어요'); return false; }
  mutate(function(s){
    var st = studyEnsure(s);
    st.items[kid] = (st.items[kid] || []).concat([{ id: uid('st'), subjectName: subjectName, text: name, done: false }]);
  });
  renderStudy();
  toast('📖 ' + name + ' 추가했어요', 1500);
  return true;
}
function studyChip(kind, id, name, on, actRename, actDel){
  if (studyRename && studyRename.kind === kind && studyRename.id === id){
    return '<input class="st-rename" data-srename="' + kind + '" value="' + esc(name) + '" aria-label="이름 수정">';
  }
  if (studyEditMode){
    return '<span class="edchip">' + esc(name)
      + '<button class="chipx" type="button" data-act="' + actRename + '" data-id="' + esc(id) + '" aria-label="이름 수정">✎</button>'
      + '<button class="chipx del" type="button" data-act="' + actDel + '" data-id="' + esc(id) + '" aria-label="삭제">✕</button>'
      + '</span>';
  }
  if (kind === 'sub'){
    return '<button class="chip' + (on ? ' on' : '') + '" type="button" data-act="study-sub" data-id="' + esc(id) + '">' + esc(name) + '</button>';
  }
  return '<button class="pchip" type="button" data-act="preset-use" data-id="' + esc(id) + '">' + esc(name) + '</button>';
}
function renderStudy(){

  var done = items.filter(function(x){ return x.done; }).length;
  var kidChips = '';
  var rows = items.map(function(it){
    if (studyEditId === it.id){

        + '<input class="sx-in rt-in" data-stin="' + esc(it.id) + '" value="' + esc(it.text) + '" aria-label="공부 내용">'

        + '<button class="sx-no" type="button" data-act="study-cancel" aria-label="취소">✕</button>'
        + '</div>';
    }
    return '<div class="rt' + (it.done ? ' done' : '') + '">'
      + '<button class="rchk" type="button" data-act="study-toggle" data-id="' + esc(it.id) + '" aria-label="공부 체크">' + (it.done ? '✓' : '') + '</button>'
      + (it.subjectName ? '<span class="st-sub">' + esc(it.subjectName) + '</span>' : '')
      + '<span class="rtt">' + esc(it.text) + '</span>'
      + '<button class="rtx ed" type="button" data-act="study-edit" data-id="' + esc(it.id) + '" aria-label="수정">✎</button>'
      + '<button class="rtx" type="button" data-act="study-del" data-id="' + esc(it.id) + '" aria-label="삭제">✕</button>'
      + '</div>';
  }).join('');
  var subChips = studySubjects().map(function(s){
    return studyChip('sub', s.id, s.name, !!sub && sub.id === s.id, 'study-sub-rename', 'study-sub-del');
  }).join('');
  var presets = sub ? studyPresets(kid, sub.id) : [];
  var presetChips = presets.map(function(p){
    return studyChip('pre', p.id, p.name, false, 'preset-rename', 'preset-del');
  }).join('');
  el.innerHTML =
      '<div class="h2">📖 오늘의 공부 체크리스트'

    +   '<div class="st-main">'
    +     (rows ? '<div class="st-list">' + rows + '</div>'
              : '<div class="st-empty">📚 오늘 공부할 내용을 적어 볼까요?</div>')
    +   '</div>'
    +   '<div class="st-tools">'
    +     '<div class="st-subrow">' + subChips

    +       '<button class="st-plus" type="button" data-act="study-add">+ 추가</button></div>'
    +   '</div>'
    + '</div>';

function studyRenameSave(){
  var r = studyRename; if (!r) return false;
  var inp = document.querySelector('[data-srename]');
  var v = ((inp && inp.value) || '').trim();
  studyRename = null;
  if (!v){ renderStudy(); return false; }
  var kid = studyKidId();
  if (r.kind === 'sub'){
    if (studySubjects().some(function(s){ return s.id !== r.id && s.name === v; })){
      toast('같은 이름의 과목이 있어요'); renderStudy(); return false;
    }
    mutate(function(s){
      var st = studyEnsure(s);
      st.subjects = st.subjects.map(function(x){ return x.id === r.id ? { id: x.id, name: v } : x; });
    });
  } else {
    var sub = studySubject();
    if (!sub){ renderStudy(); return false; }
    mutate(function(s){
      var st = studyEnsure(s);
      st.presets[kid] = st.presets[kid] || {};
      st.presets[kid][sub.id] = ((st.presets[kid][sub.id] || [])).map(function(x){
        return x.id === r.id ? { id: x.id, name: v } : x;
      });
    });
  }
  renderStudy();
  toast('✎ 이름을 바꿨어요');
  return true;
}

/* 달력 — 기기별로 보는 달·골라둔 날짜 (동기화하지 않음) */
var calSel = null;        // null이면 오늘
var calView = null;       // {y, m} null이면 이번 달
var schedEditId = null;   // 인라인 수정 중인 일정 id
function calSelKey(){ return calSel || todayKey(); }
function calLabel(key){
  if (key === todayKey()) return '오늘(' + cleanMd(key) + ')';
  var d = parseKey(key);
  return cleanMd(key) + '(' + ['일','월','화','수','목','금','토'][d.getDay()] + ')';
}
function calSetSel(key){
  calSel = (key === todayKey()) ? null : key;
  var p = String(key).split('-').map(Number);
  calView = { y: p[0], m: p[1] - 1 };
  schedEditId = null;
  renderCal();
}
function calThisMonth(){ var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; }
function calShiftMonth(delta){
  var v = calView || calThisMonth(), y = v.y, m = v.m + delta;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  calView = { y: y, m: m };
  var sp = calSelKey().split('-').map(Number);
  if (sp[0] !== y || (sp[1] - 1) !== m){
    var tm = calThisMonth();
    var day = (y === tm.y && m === tm.m) ? new Date().getDate() : 1;
    calSel = (ymd(new Date(y, m, day)) === todayKey()) ? null : ymd(new Date(y, m, day));
  }
  schedEditId = null;
  renderCal();
}
function renderCal(){

  var v = calView || calThisMonth(), y = v.y, mo = v.m, today = todayKey(), sel = calSelKey();
  var first = new Date(y, mo, 1), lastDay = new Date(y, mo+1, 0).getDate();
  var cells = '';

  var items = schedList(sel).map(function(it){

      +   '<button class="sib" type="button" data-act="sched-edit" data-id="' + esc(it.id) + '" aria-label="이름 수정">✎</button>'
      +   '<button class="sib del" type="button" data-act="sched-del" data-id="' + esc(it.id) + '" aria-label="삭제">×</button>'
      + '</span></div>';
  }).join('');
  var ups = upcomingItems(6).map(function(x){
    var u = parseKey(x.date), n = dayDiff(x.date);
    return '<button class="upitem' + (n === 0 ? ' today' : '') + '" type="button" data-act="cal-jump" data-d="' + esc(x.date) + '"'

}
function ddayLabel(n){ return n === 0 ? '오늘' : n === 1 ? '내일' : n === 2 ? '모레' : n + '일 뒤'; }
function upIcon(text){
  var t = String(text || '');
  if (/생일|생신|파티|기념|돌잔치/.test(t)) return '🎂';
  if (/여행|캠핑|카라반|글램핑|숙소|펜션|나들이/.test(t)) return '🏕️';
  if (/병원|치과|의원|진료|접종|검진/.test(t)) return '🏥';
  if (/학교|학원|숙제|준비물|체육|시험|수업|학습|문제집/.test(t)) return '🎒';
  return '📌';
}
function dayDiff(key){
  var a = parseKey(todayKey()), b = parseKey(key);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function upcomingItems(limit){
  var today = todayKey(), out = [];
  function push(key, text){
    text = String(text || '').trim();
    if (!key || !text || key < today) return;
    out.push({ date: key, text: text });
  }
  schedList(today).forEach(function(it){ push(today, it.text); });
  Object.keys(state.cal || {}).forEach(function(k){
    (state.cal[k] || []).forEach(function(it){ push(k, it.text); });
  });
  var seen = {};
  out = out.filter(function(x){
    var k = x.date + '|' + x.text;
    if (seen[k]) return false;
    seen[k] = 1; return true;
  }).sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return out.slice(0, limit || 6);
}

}

function toast(text, ms){
  var el = $('#toast'); if (!el) return;
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('on'); }, ms || 2200);
}
function beep(times){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = window.__ac || (window.__ac = new AC());
    for (var i=0;i<(times||2);i++){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880 - i*80;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.32);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i*0.32 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.32 + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*0.32); o.stop(ctx.currentTime + i*0.32 + 0.32);
    }
  } catch(e){}
}
function notify(title, body){
  if (!('Notification' in window)) return;
  try { if (Notification.permission === 'granted') new Notification(title, { body: body, tag: 'family-dashboard' }); } catch(e){}
}
function askNotify(){
  if (!('Notification' in window)) return;
  try { if (Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
}
var CF_COLORS = ['#FFD166','#F4978E','#A8DDB5','#9BD0F5','#E6B8F0','#FFE08A'];
function confetti(n){
  var layer = $('#confetti'); if (!layer) return;
  for (var i=0;i<(n||26);i++){
    var s = document.createElement('i');
    s.className = 'cf';
    s.style.left = (Math.random()*100) + '%';
    s.style.background = CF_COLORS[i % CF_COLORS.length];
    s.style.animationDelay = (Math.random()*0.45).toFixed(2) + 's';
    s.style.setProperty('--dx', (Math.random()*120-60).toFixed(0) + 'px');
    layer.appendChild(s);
    setTimeout((function(el){ return function(){ el.remove(); }; })(s), 2700);
  }
}

document.addEventListener('click', function(ev){
  var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el || !state) return;
  var act = el.dataset.act, m = el.dataset.m;

  /* 아이 루틴 */
  if (act === 'kid-tab'){
    prefs.tabs[m] = el.dataset.tab; savePrefs(); rtEdit = null; renderKids();
    return;
  }
  if (act === 'kid-pick'){
    var pk = el.dataset.m;
    if (prefs.activeKid === pk){ prefs.kidOpen = !prefs.kidOpen; }
    else { prefs.activeKid = pk; prefs.kidOpen = true; }
    savePrefs(); rtEdit = null; studyEditId = null; renderKids();
    return;
  }
  if (act === 'kid-fold'){ prefs.kidOpen = false; savePrefs(); renderKids(); return; }
  if (act === 'avatar-open'){ openAvatarSheet(el.dataset.m); return; }
  if (act === 'av-pick'){
    if (avatarDraft){ avatarDraft.av[el.dataset.k] = el.dataset.v; renderAvatarSheet(); }
    return;
  }
  if (act === 'av-tab'){ avatarTab = el.dataset.tab; renderAvatarSheet(); return; }
  if (act === 'av-save'){
    if (!avatarDraft) return;
    var avKid = avatarDraft.kid, avNew = Object.assign({}, avatarDraft.av);
    mutate(function(s){ s.avatars = s.avatars || {}; s.avatars[avKid] = avNew; });
    avatarDraft = null; closeCommuteSheet(); renderKids();
    toast('✨ ' + ((FAMILY[avKid] || {}).name || '') + ' 캐릭터를 저장했어요', 2000);
    return;
  }
  if (act === 'cal-jump'){
    var jd = el.dataset.d;
    if (jd) calSetSel(jd);
    var calBox = $('#cal');
    if (calBox && calBox.scrollIntoView) calBox.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  if (act === 'rt-toggle'){
    var tabA = el.dataset.tab, idA = el.dataset.id;
    var itemA = listOf(m, tabA).filter(function(x){ return x.id === idA; })[0];
    if (!itemA) return;
    mutate(function(){ itemA.done = !itemA.done; });
    afterRoutine(); checkHighFive();
    return;
  }
  if (act === 'rt-del'){
    var tabB = el.dataset.tab, idB = el.dataset.id;
    mutate(function(s){
      s.kids[m][tabB] = (s.kids[m][tabB] || []).filter(function(t){ return t.id !== idB; });
    });
    afterRoutine();
    return;
  }
  if (act === 'rt-add'){
    var tabC = el.dataset.tab;
    var inpC = $('[data-addrt="' + m + '"][data-tab="' + tabC + '"]');
    var vC = ((inpC && inpC.value) || '').trim();
    if (!vC){ if (inpC) inpC.focus(); return; }
    mutate(function(s){
      s.kids[m][tabC] = (s.kids[m][tabC] || []).concat([{ id: uid('r'), text: vC, done: false }]);
    });
    if (inpC) inpC.value = '';
    afterRoutine();
    return;
  }
  if (act === 'rt-edit'){
    rtEdit = { m: m, tab: el.dataset.tab, id: el.dataset.id };
    renderKids();
    focusEditInput('[data-rtein]');
    return;
  }
  if (act === 'rt-save'){
    var rowR = el.closest ? el.closest('.rt') : null;
    var inpR = rowR ? rowR.querySelector('[data-rtein]') : null;
    rtSaveText(m, el.dataset.tab, el.dataset.id, inpR ? inpR.value : '');
    return;
  }
  if (act === 'rt-cancel'){ rtEdit = null; renderKids(); return; }

  /* 치즈집 청소 — 고른 날짜(기본 오늘) 기준으로 추가·해제 */
  if (act === 'clean'){

    mutate(function(s){ s.clean = s.clean.filter(function(e){ return e.id !== delId; }); });

    return;
