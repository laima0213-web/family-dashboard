
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>루틴 통계 미리보기</title>
<style>
/* ============================================================
   글씨체 — 동글동글한 무료 손글씨 웹폰트 (상업용 무료 · 프로젝트 눈누)
   1지망 그리운 몽토리체 → 2지망 KOTRA 희망체(한글 완성형 11,172자) → 기본 고딕
   ============================================================ */
@font-face{
  font-family:'Griun_Mongtori-Rg';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_Mongtori-Rg.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'KOTRAHOPE';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRAHOPE.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}
/* ============================================================
   우리집 대시보드 v3 — 디자인 토큰
   ============================================================ */
:root{
  --bg:#FBF6EC; --paper:#FFFDFA; --line:#F0E7D7; --ink:#463C34; --sub:#95897B; --faint:#BCAF9F;
  --mint:#EAF7EC; --mintd:#5FA97A; --peach:#FFF1E6; --pink:#FFE9EF; --sky:#E9F3FD; --butter:#FFF6D0;
  --shadow:0 6px 16px rgba(180,158,128,.12);
  --gap:10px; --pad:12px; --r:18px;
  --h2:13.5px; --rt-h:32px; --chip-h:27px; --inp-h:34px; --mini:10.5px; --st-h:20px; --fs:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Griun_Mongtori-Rg','KOTRAHOPE',"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:var(--fs);line-height:1.45;letter-spacing:-.2px}
button,input,textarea,select{font-family:inherit;letter-spacing:inherit}
h1,h2,h3,p,ul,li{margin:0;padding:0}
ul{list-style:none}
button{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;padding:10px 12px 34px}
.app[hidden]{display:none!important}
.muted{color:var(--sub)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 상단 바 ---------- */
.topbar{display:grid;grid-template-areas:"l l" "c w" "q q";grid-template-columns:auto 1fr;
  align-items:center;gap:8px;margin-bottom:var(--gap)}
.tb-l{grid-area:l;display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);
  border-radius:13px;font-size:19px;box-shadow:var(--shadow)}
.topbar h1{font-size:19px;letter-spacing:-.8px;line-height:1.15}
.tb-date{font-size:13px;color:var(--sub);margin-top:1px}
.tb-date b{color:#7C6F60}
.clock{grid-area:c;justify-self:start;display:flex;align-items:baseline;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);white-space:nowrap}
.ck-l{font-size:11.5px;font-weight:800;color:var(--faint)}
.ck-t{font-size:17px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.wx{grid-area:w;justify-self:end;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden}
.wx-ico{font-size:16px}
.wx-temp{font-size:16px;font-weight:900;letter-spacing:-.5px}
.wx-desc{font-size:12px;color:var(--sub);font-weight:700}
.wx-loc{font-size:11px;font-weight:800;color:#A2937F;background:#FFF8EE;border:1px solid #F3E6D6;border-radius:999px;padding:2px 7px}
.wx-air{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.g-good{background:#E4F1FD;color:#3E7CB1}.g-ok{background:#E7F6E8;color:#4E9A66}
.g-bad{background:#FFE8E1;color:#C1604A}.g-vbad{background:#FBE0DC;color:#A9442F}

/* ---------- 캐릭터 · 빠른 칩 ---------- */
.ava{width:34px;height:34px;flex:0 0 34px}
.ava svg{width:100%;height:100%;display:block}
.ava.xs{width:20px;height:20px;flex:0 0 20px}
.quickrow{grid-area:q;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cchip{display:flex;align-items:center;gap:4px;height:var(--chip-h);border:1px solid #EADFCB;background:#fff;
  border-radius:999px;padding:0 12px;font-size:12.5px;font-weight:800;color:#6F6252;cursor:pointer;box-shadow:0 2px 6px rgba(180,158,128,.1)}
.cchip b{color:#C08344}
.cchip.hf{background:linear-gradient(100deg,#FFF3CC,#EAF7EC);border-color:#F0E2B4;color:#8A6A28;cursor:default}

/* ---------- 공통 카드 ---------- */
.grid{display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);min-width:0}
.h2{display:flex;align-items:center;gap:6px;font-size:var(--h2);font-weight:900;letter-spacing:-.5px;margin-bottom:7px}
.h2 small{margin-left:auto;font-size:var(--mini);font-weight:700;color:var(--sub);letter-spacing:0;white-space:nowrap}
.h2 .tail{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:var(--mini);font-weight:700;color:var(--sub)}

/* ---------- 아이 루틴 카드 ---------- */
.kid{position:relative;overflow:hidden}
.kid::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.kid.k1{background:linear-gradient(160deg,#FFFDF6,#FBFBF4)}
.kid.k2{background:linear-gradient(160deg,#FFF9F2,#FDFBF6)}
.kid-hf{box-shadow:0 0 0 2px #F5D98A inset,var(--shadow)}
.kid-head{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.kid-id{min-width:0;flex:1}
.kid-name{display:flex;align-items:center;gap:5px;font-size:16.5px;font-weight:900;letter-spacing:-.6px}
.ktag{font-size:10.5px;font-weight:800;color:#A2937F;background:#fff;border:1px solid #EDE4D6;border-radius:999px;padding:1px 6px}
.hfi{font-size:15.5px;animation:pop .9s ease infinite alternate}
@keyframes pop{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.25) rotate(8deg)}}
.kid-sub{font-size:var(--mini);color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbadge{font-size:11.5px;font-weight:900;color:#A9762F;background:var(--butter);border:1px solid #F3E3A9;border-radius:999px;padding:3px 8px;white-space:nowrap}
.kdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 2px}
.kdot{height:21px;border-radius:7px;background:#F7F1E6;color:#B3A695;font-size:10.5px;font-weight:800;
  display:grid;place-items:center}
.kdot.done{background:#DDF1E2;color:#3F8355}
.kdot.miss{background:#FCE6E2;color:#C4654A}
.kdot.today{box-shadow:0 0 0 2px #F2D588 inset;color:#A9801F;background:#FFF7DE}
.kdot.today.done{background:#DDF1E2;box-shadow:0 0 0 2px #8FC7A2 inset;color:#3F8355}
.ktabs{display:flex;gap:3px;background:#F5F0E7;padding:3px;border-radius:12px;margin-top:10px}
.ktab{flex:1;border:0;background:transparent;border-radius:9px;padding:5px 0;font-size:12.5px;font-weight:800;
  color:#A2937F;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.ktab b{font-size:11px;font-weight:900;background:#EBE3D6;color:#8A7C6B;border-radius:999px;padding:1px 6px}
.ktab.on{background:#fff;color:#463C34;box-shadow:0 2px 6px rgba(160,140,115,.16)}
.ktab.on b{background:#E7F6E8;color:#4E9A66}
.ktab.on.eve b{background:#F3E9FB;color:#7B5AA6}
.ktab .kth{font-size:10.5px;line-height:1}
.rts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rt{display:flex;align-items:center;gap:7px;height:var(--rt-h);background:#FBF7F0;border:1px solid #F2E9DB;
  border-radius:11px;padding:0 8px}
.rt.done{background:#F1FAF3;border-color:#DCEEDE}
.rchk{width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:2px solid #DCCEBB;background:#fff;
  display:grid;place-items:center;font-size:11.5px;color:#fff;cursor:pointer;padding:0}
.rt.done .rchk{background:#7FC79A;border-color:#7FC79A}
.rtt{font-size:13px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt.done .rtt{color:#A4B7A7;text-decoration:line-through}
.wbmark{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:900;color:#A9762F;background:#FFF5D8;
  border:1px solid #F0DFA8;border-radius:999px;padding:1px 6px;white-space:nowrap}
.rt .wbmark + .rtx{margin-left:0}
.rtx{margin-left:auto;border:0;background:transparent;color:#D6C6B3;font-size:11.5px;cursor:pointer;padding:2px 3px}
.rt-add{display:flex;gap:4px;margin-top:5px}
.rt-add input{flex:1;min-width:0;height:var(--inp-h);border:1px dashed #DFD0BB;background:#FFFDF8;border-radius:10px;
  padding:0 8px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.rt-add input::placeholder{color:#C6B7A4}
.addb{width:var(--inp-h);height:var(--inp-h);flex:0 0 auto;border:1px solid #E4D6C1;background:#fff;border-radius:10px;
  font-size:15.5px;font-weight:900;color:#8B7A63;cursor:pointer;line-height:1}

/* ---------- 치즈집 청소 ---------- */
.clean-t{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.clean-btns{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:5px;height:30px;border:1px solid #E7DCCB;background:#fff;border-radius:11px;
  padding:0 12px;font-size:13.5px;font-weight:900;color:#6F6252;cursor:pointer}
.cbtn.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 4px 10px rgba(95,169,122,.3)}
.cbtn .n{font-size:11px;font-weight:900;background:#F3EADB;color:#8A7C6B;border-radius:999px;padding:1px 6px}
.cbtn.on .n{background:rgba(255,255,255,.3);color:#fff}
.clean-cnt{font-size:12px;color:var(--sub);margin-top:7px}
.clean-cnt b{color:#5C8F6D}
.clean-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.clean-log{font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.35}
.undo{border:1px solid #EADFCB;background:#FFF8EA;border-radius:9px;padding:4px 8px;font-size:11.5px;font-weight:800;
  color:#8B7A63;cursor:pointer}
.today-rec{font-size:11.5px;color:var(--faint);font-weight:800}
.today-rec.on{color:#5C8F6D}
/* 날짜 선택 + 기록 목록 (지난 날짜도 추가·수정·삭제) */
.clean-nav{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.cnav{width:26px;height:28px;flex:0 0 26px;border:1px solid #E7DCCB;background:#fff;border-radius:9px;
  font-size:11.5px;font-weight:900;color:#8B7A63;cursor:pointer;line-height:1;padding:0}
.cnav:disabled{opacity:.3;cursor:default}
.cdate{flex:1 1 auto;min-width:0;height:28px;border:1px solid #E7DCCB;background:#FFFDF8;border-radius:9px;
  padding:0 5px;font:inherit;font-size:13px;font-weight:800;color:#5C5044;letter-spacing:-.2px}
.cdate::-webkit-calendar-picker-indicator{opacity:.45;width:13px;height:13px;padding:0}
.cnow{flex:0 0 auto;height:28px;border:1px solid #CFE4D5;background:#EFF9F1;border-radius:9px;padding:0 8px;
  font-size:12px;font-weight:900;color:#4E8F65;cursor:pointer;white-space:nowrap}
.cl-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cl-empty{font-size:11px;color:var(--faint);margin-top:5px}
.cl-chip{display:inline-flex;align-items:center;background:#F7F2E9;border:1px solid #EEE3D2;border-radius:999px;overflow:hidden}
.cl-chip .cj{border:0;background:transparent;cursor:pointer;padding:2px 1px 2px 7px;
  font-size:11px;font-weight:800;color:#7A6C5C;white-space:nowrap;letter-spacing:-.2px}
.cl-chip .cj:active{color:#4E8F65}
.cl-chip .cd{border:0;background:transparent;cursor:pointer;padding:1px 6px 1px 3px;
  font-size:12.5px;line-height:1.1;color:#CBBBA6}
.cl-chip .cd:active{color:#C4654A}
.cl-more{display:flex;align-items:center;gap:6px;margin-top:5px}
.cl-toggle{border:1px solid #EADFCB;background:#FFF8EA;border-radius:9px;padding:2px 7px;
  font-size:11px;font-weight:800;color:#8B7A63;cursor:pointer}
@media (min-width:1024px){
  .clean-nav{gap:4px;margin-bottom:5px}
  .cnav{width:20px;height:20px;flex-basis:20px;font-size:9.5px;border-radius:7px}
  .cdate{height:20px;font-size:11px;border-radius:7px;padding:0 4px}
  .cnow{height:20px;font-size:10px;padding:0 6px;border-radius:7px}
  .cl-list{gap:3px;margin-top:4px}
  .cl-chip .cj{font-size:9.5px;padding:1px 1px 1px 5px}
  .cl-chip .cd{font-size:10.5px;padding:1px 4px 1px 2px}
  .cl-toggle{font-size:9.5px;padding:1px 5px}
  .cl-empty{font-size:10px;margin-top:4px}
}

/* ---------- 보상 도장판 ---------- */
.rnote{font-size:11px;color:#A9752F;font-weight:800;background:#FFF8E6;border:1px solid #F3E7C9;
  border-radius:9px;padding:3px 7px;margin-bottom:7px;line-height:1.35}
.rwk{margin-bottom:8px}
.rwk:last-child{margin-bottom:0}
.rwk-h{display:flex;align-items:center;gap:5px;font-size:13px}
.rwk-h b{letter-spacing:-.4px}
.rwk-m{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:4px}
.st{height:var(--st-h);border-radius:5px;background:#F8F2E9;border:1px dashed #EADDC8;display:grid;place-items:center;
  font-size:9.5px;color:#CBBBA6;font-weight:800}
.st.on{background:linear-gradient(160deg,#FFF2C4,#FFE08A);border:1px solid #F1CE6E;color:#8A6420}
.st.miss{background:#FBEAEA;border:1px solid #F3D6D6;color:#C58A8A}
.st.today{box-shadow:0 0 0 2px #8FC7A2;border-style:solid;color:#5C8F6D}

/* ---------- 우편함 ---------- */
.mrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.lab{font-size:11px;font-weight:900;color:var(--faint);white-space:nowrap;min-width:34px}
.chip{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:var(--chip-h);padding:0 10px;
  font-size:12px;font-weight:800;color:#8B7A63;cursor:pointer;white-space:nowrap}
.chip.on{background:#5FA97A;border-color:#5FA97A;color:#fff}
.chip.on.pink{background:#E28DA4;border-color:#E28DA4}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:2px 0 6px}
.qbtn{border:1px solid #EFE1CB;background:#FFFBF3;border-radius:10px;height:29px;font-size:12px;font-weight:800;
  color:#7A6A58;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.qbtn:active{transform:scale(.97)}
.crow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.cbtn2{border:1px solid #DCE9F6;background:#F4FAFF;border-radius:999px;height:var(--chip-h);padding:0 8px;
  font-size:12px;font-weight:800;color:#4C7FA8;cursor:pointer;white-space:nowrap}
.cbtn2.now{background:#5EA8DE;border-color:#5EA8DE;color:#fff}
.cbtn2.on{background:#5EA8DE;border-color:#5EA8DE;color:#fff}
.tag{flex:0 0 auto;border:1px solid #F0DCC8;background:#fff;border-radius:999px;height:var(--chip-h);padding:0 9px;
  font-size:12px;font-weight:800;color:#A9744E;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px}
.tag:active{transform:scale(.97)}
.tag.on{background:linear-gradient(160deg,#FFF3DE,#FFEBD2);border-color:#EDCB9B;color:#A2632A;
  box-shadow:0 2px 7px rgba(214,166,102,.22)}
.tag .v{color:#fff;background:#D79A4E;font-weight:900;font-size:11px;border-radius:999px;
  padding:1px 5px;min-width:14px;text-align:center}
/* ---------- 오늘의 공부 체크리스트 ---------- */
.st-badge{margin-left:2px;font-size:11px;font-weight:900;color:#7B5AA6;background:#F5ECFB;
  border:1px solid #E9D9F6;border-radius:999px;padding:2px 8px;white-space:nowrap;letter-spacing:0}
.st-kids{display:flex;gap:3px;margin-left:auto}
/* 공부 추가·수정·삭제 잠금 배지 */
.st-lock{margin-left:2px;display:inline-flex;align-items:center;border:1px solid #E7DCCB;background:#FFF9EE;
  border-radius:999px;height:20px;padding:0 8px;font-size:10px;font-weight:900;color:#8B7A63;cursor:pointer;
  white-space:nowrap;letter-spacing:0;flex:0 0 auto}
.st-lock.on{background:#EAF7EF;border-color:#CBE7D6;color:#3F7A57}
.st-lock:active{transform:scale(.96)}
.st-lock .lks{display:none}
@media (max-width:430px){
  .st-lock{height:17px;font-size:9.5px;padding:0 6px}
  .st-lock .lkl{display:none}
  .st-lock .lks{display:inline}
}
.skk{height:22px;border:1px solid #E7DCCB;background:#fff;border-radius:999px;padding:0 10px;
  font-size:12px;font-weight:900;color:#8B7A63;cursor:pointer}
.skk.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 3px 8px rgba(95,169,122,.25)}
.st-prog{height:4px;border-radius:999px;background:#F3EDE3;overflow:hidden;margin:0 0 7px}
.st-prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9BD0B6,#5FA97A);transition:width .25s}
.st-body{display:block}
.st-empty{font-size:12px;font-weight:800;color:var(--faint);text-align:center;padding:9px 6px;
  background:#FFFCF6;border:1px dashed #EFE3D2;border-radius:12px}
.st-list{display:flex;flex-direction:column;gap:4px}
.st-list .rt .rtt{flex:1 1 auto}
/* 📖 오늘 탭 — 오늘의 할 일과 같은 체크리스트 한 줄 목록 */
#study .rts{margin-top:7px}
#study .rts .rt{height:auto;min-height:var(--rt-h);padding:2px 8px}
#study .rts .rt .rtt{flex:1 1 auto;min-width:0;white-space:normal;overflow:visible;text-overflow:clip;
  overflow-wrap:anywhere;line-height:1.25;padding:1px 0}
#study .rts .st-sub{margin-right:1px}
/* ---------- 이번 달의 독서리스트 ---------- */
.rd-nav{display:flex;align-items:center;gap:4px;margin:0 0 6px}
.rd-mon{font-size:12.5px;font-weight:900;color:#7A6A58;min-width:32px;text-align:center}
.rd-list{display:flex;flex-direction:column;gap:4px}
.rd{display:flex;align-items:center;gap:5px;min-height:var(--rt-h);background:#FFFDF6;
  border:1px solid #F1E7D6;border-radius:11px;padding:3px 7px}
.rd-ico{flex:0 0 auto;font-size:11.5px;line-height:1}
.rd-title{flex:0 1 auto;max-width:52%;font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-author{flex:1 1 auto;min-width:0;font-size:11px;font-weight:700;color:#A99A86;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-date{flex:0 0 auto;margin-left:auto;font-size:10px;font-weight:800;color:#C2B4A2;font-variant-numeric:tabular-nums}
.rd .rtx{margin-left:0}
.rd-empty{font-size:12px;font-weight:800;color:var(--faint);text-align:center;padding:9px 6px;
  background:#FFFCF6;border:1px dashed #EFE3D2;border-radius:12px}
.rd-add{display:flex;gap:4px;margin-top:5px}

.prof-ava .avface{width:100%;height:100%;object-fit:cover;border-radius:15px;display:block}
.prof-id{min-width:0;flex:1}
.prof-name{display:flex;align-items:center;gap:4px;font-size:15.5px;font-weight:900;letter-spacing:-.5px;flex-wrap:wrap}
.prof-sub{display:flex;gap:4px;margin-top:2px;font-size:11px;font-weight:800;color:#A2937F;flex-wrap:wrap}
.prof-sub .pms{padding:1px 5px;border-radius:999px;background:#F7F1E7}
.prof-sub .pms.on{background:#E4F5E9;color:#4E8F63}
.prof .kdots{margin:7px 0 0;gap:3px}
.prof .kdot{height:15px;border-radius:5px;font-size:9.5px}
.prof-foot{display:flex;align-items:center;gap:4px;margin-top:6px}
.prof-meta{font-size:10px;font-weight:800;color:#B0A392;white-space:nowrap}
.prof-edit{margin-left:auto;border:1px solid #DFEAF8;background:#F4F9FF;color:#5E86B5;border-radius:999px;
  padding:2px 7px;font-size:10.5px;font-weight:900;cursor:pointer;white-space:nowrap}
.prof-edit:active{transform:scale(.96)}
/* ---------- 선택한 아이 상세 ---------- */
.kd[hidden]{display:none!important}
.kd-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.kd-ava{width:22px;height:28px;flex:0 0 22px;display:grid;place-items:center}
.kd-ava .avface{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.kd-title{font-size:14px;font-weight:900;letter-spacing:-.4px}
.kd-hf{font-size:11.5px}
.kd-fold{margin-left:auto;border:1px solid #EADFCB;background:#FFF8EA;border-radius:999px;padding:3px 9px;
  font-size:11px;font-weight:800;color:#8B7A63;cursor:pointer}
.kd-grid{display:block}
.kd-col{min-width:0}
.kd-col + .kd-col{margin-top:9px}
/* ---------- 다가오는 일정 ---------- */
.cal-wrap{display:block}
.cal-l{min-width:0}
.cal-r{margin-top:9px}
.uplist{display:flex;flex-direction:column;gap:4px}
.upitem{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid #F0E7D7;
  background:#FFFDF8;border-radius:11px;padding:5px 8px;cursor:pointer;font:inherit}
.upitem.today{background:#FFF9EA;border-color:#F2E2BC}
.upico{font-size:13.5px;flex:0 0 auto}
.upbody{min-width:0;flex:1;display:flex;flex-direction:column}
.uptx{font-size:12px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updt{font-size:10px;color:#B0A392;font-weight:700}
.upbadge{flex:0 0 auto;font-size:10px;font-weight:900;color:#4C7FA8;background:#EAF2FB;border-radius:999px;padding:1px 6px}
.upitem.today .upbadge{background:#FFE9B8;color:#A9801F}
.upempty{font-size:11px;color:var(--faint);font-weight:700;text-align:center;padding:10px 6px;
  background:#FFFCF6;border:1px dashed #EEE2D0;border-radius:11px;line-height:1.5}
/* ---------- 캐릭터 꾸미기 시트 ---------- */
.av-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
/* 마이홈 일러스트 뷰 */
.avw{position:relative;overflow:hidden;display:grid;place-items:center}
.av-top .avw{width:118px;height:118px;flex:0 0 118px;border-radius:26px;border:1px solid #F0E6D6;
  box-shadow:0 4px 10px rgba(160,140,110,.12)}
.av-top .avw > img{width:97%;height:97%;object-fit:contain;position:relative;z-index:1}
.avd{position:absolute;pointer-events:none;z-index:2;line-height:1}
.avd-crown{top:-7px;left:50%;font-size:25px;filter:drop-shadow(0 2px 3px rgba(180,140,60,.35));animation:avdBob 1.6s ease-in-out infinite}
.avd-s1{top:5px;left:7px;font-size:16.5px;animation:avdTw 1.4s ease-in-out infinite}
.avd-s2{top:13px;right:9px;font-size:13.5px;animation:avdTw 1.4s .45s ease-in-out infinite}
.avd-s3{bottom:15px;left:11px;font-size:12.5px;animation:avdTw 1.4s .9s ease-in-out infinite}
.avd-h1{top:7px;right:9px;font-size:15.5px;animation:avdFloat 2.2s ease-in-out infinite}
.avd-h2{bottom:13px;left:8px;font-size:12.5px;animation:avdFloat 2.2s .7s ease-in-out infinite}
.avd-h3{top:42%;left:6px;font-size:10.5px;animation:avdFloat 2.2s 1.3s ease-in-out infinite}
.avd-f1{top:9px;left:9px;font-size:14.5px;animation:avdFall 2.6s linear infinite}
.avd-f2{top:9px;right:13px;font-size:12.5px;animation:avdFall 2.6s .9s linear infinite}
.avd-f3{top:9px;left:46%;font-size:11.5px;animation:avdFall 2.6s 1.7s linear infinite}
.avd-rb{position:absolute;inset:0;z-index:0;background:conic-gradient(from 20deg,#FFD1DC,#FFE9B8,#D2F5DC,#CDE8FF,#E4DAFB,#FFD1DC);opacity:.85}
/* v13 추가 꾸미기 — 나비 · 리본 · 네잎클로버 · 딸기 · 음표 · 별무리 · 발자국 (얼굴은 비우고 모서리·둘레만) */
.avd-b1{top:6px;right:8px;font-size:15px;animation:avdFloat 2.4s ease-in-out infinite}
.avd-b2{bottom:17px;left:9px;font-size:12.5px;animation:avdFloat 2.4s .8s ease-in-out infinite}
.avd-r1{top:5px;right:7px;font-size:16px;transform:rotate(-12deg);opacity:.95}
.avd-r2{bottom:14px;left:8px;font-size:11.5px;transform:rotate(14deg);opacity:.9}
.avd-c1{top:9px;left:8px;font-size:14px;animation:avdFloat 2.6s ease-in-out infinite}
.avd-c2{top:12px;right:10px;font-size:11.5px;animation:avdFloat 2.6s .7s ease-in-out infinite}
.avd-c3{bottom:14px;left:11px;font-size:11px;animation:avdFloat 2.6s 1.2s ease-in-out infinite}
.avd-st1{top:7px;left:9px;font-size:15px;animation:avdFloat 2.3s ease-in-out infinite}
.avd-st2{top:11px;right:9px;font-size:11.5px;animation:avdFloat 2.3s .6s ease-in-out infinite}
.avd-st3{bottom:16px;right:11px;font-size:10.5px;animation:avdFloat 2.3s 1.1s ease-in-out infinite}
.avd-n1{top:9px;right:10px;font-size:14px;animation:avdFloat 2.8s ease-in-out infinite}
.avd-n2{top:14px;left:9px;font-size:12px;animation:avdFloat 2.8s .9s ease-in-out infinite}
.avd-n3{bottom:18px;right:12px;font-size:11px;animation:avdFloat 2.8s 1.7s ease-in-out infinite}
.avd-t1{top:7px;left:9px;font-size:15px;animation:avdTw 1.9s ease-in-out infinite}
.avd-t2{top:34%;right:8px;font-size:11.5px;animation:avdTw 1.9s .5s ease-in-out infinite}
.avd-t3{bottom:13px;left:14px;font-size:10.5px;animation:avdTw 1.9s 1s ease-in-out infinite}
.avd-t4{bottom:26px;right:16px;font-size:9.5px;animation:avdTw 1.9s 1.4s ease-in-out infinite}
.avd-p1{top:9px;left:9px;font-size:13.5px;transform:rotate(-18deg);opacity:.92}
.avd-p2{bottom:16px;right:10px;font-size:11.5px;transform:rotate(16deg);opacity:.92}
.avd-p3{bottom:24px;left:12px;font-size:10.5px;transform:rotate(-8deg);opacity:.85}
@keyframes avdTw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes avdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes avdFall{0%{transform:translateY(-4px) rotate(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(104px) rotate(160deg);opacity:0}}
@keyframes avdBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
/* 캐릭터 고르기 그리드 */
.av-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
.av-card{border:1.5px solid #EFE3D2;background:#FFFEFB;border-radius:14px;padding:6px 4px 5px;display:flex;
  flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.av-card.on{border-color:#5FA97A;background:#F2FBF5;box-shadow:0 3px 8px rgba(95,169,122,.2)}
.av-card-img{width:100%;height:62px;display:grid;place-items:center}
.av-card-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.av-card-n{font-size:12px;font-weight:800;color:#7A6A58;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.av-card.on .av-card-n{color:#3E7A54}
/* 배경 색 칩 */
.av-bgs{display:flex;flex-wrap:wrap;gap:9px}
.av-bgchip{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #E3D6C6;cursor:pointer;
  font-size:15.5px;font-weight:900;color:#8B7A63;display:grid;place-items:center;padding:0}
.av-bgchip.on{box-shadow:0 0 0 2.5px #5FA97A;transform:scale(1.06)}
/* 남은 개수 응원 박스 */
.remain-box{display:flex;align-items:center;gap:8px;margin-top:7px;background:#FFF6F1;border:1px solid #F6DFD5;
  border-radius:13px;padding:7px 10px}
.remain-box.all{background:#F2FBF3;border-color:#CDEAD6}
.remain-box.zero{background:#FFFCF4;border-color:#F0E6CF}
.rb-ico{width:31px;height:31px;flex:0 0 31px;border-radius:9px;background:#fff;border:1px solid #F0E2DA;
  display:grid;place-items:center;overflow:hidden}
.rb-ico .avface{width:100%;height:100%;object-fit:cover;display:block}
.rb-ico.on{font-size:17px}
.rb-txt{display:flex;flex-direction:column;min-width:0}
.rb-txt b{font-size:15.5px;font-weight:900;color:#B26A5E;letter-spacing:-.3px;line-height:1.25}
.remain-box.all .rb-txt b{color:#4E8F63}
.remain-box.zero .rb-txt b{color:#8B7A63}
.rb-txt small{font-size:13px;font-weight:800;color:#C68E82;margin-top:1px}
.remain-box.all .rb-txt small{color:#6FA97E}
.remain-box.zero .rb-txt small{color:#A99A88}
.av-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.av-txt b{font-size:14.5px}
.av-txt small{font-size:11.5px;color:var(--sub);font-weight:700}
.av-tip{font-size:10.5px;font-weight:800;color:#A99F92;background:#FFF6E9;border:1px solid #F3E6D2;
  border-radius:999px;padding:2px 8px;align-self:flex-start;margin-top:3px}
.av-tabs{display:flex;gap:4px;margin:4px 0 2px}
.avtab{flex:1;height:30px;border:1px solid #E7DCCB;background:#FFFDF8;border-radius:10px;
  font-size:11.5px;font-weight:800;color:#8B7A63;cursor:pointer;white-space:nowrap;padding:0 2px}
.avtab.on{background:#F5ECFB;border-color:#E2CFF2;color:#7B5AA6;font-weight:900;
  box-shadow:0 2px 6px rgba(150,120,190,.16)}
.av-sec{margin-top:8px}
.av-lab{font-size:11.5px;font-weight:900;color:#8B7A63;margin-bottom:4px}
.av-opts{display:flex;flex-wrap:wrap;gap:4px}
.avopt{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:26px;padding:0 10px;
  font-size:12px;font-weight:800;color:#7A6A58;cursor:pointer;white-space:nowrap}
.avopt.on{background:#5FA97A;border-color:#5FA97A;color:#fff;box-shadow:0 3px 8px rgba(95,169,122,.25)}
.av-foot{display:flex;gap:6px;margin-top:12px}
.av-save{flex:1;height:40px;border:0;border-radius:12px;background:var(--mintd);color:#fff;font-size:14.5px;
  font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(95,169,122,.28)}
.av-cancel{flex:0 0 auto;height:40px;border:1px solid #E7DCCB;background:#fff;border-radius:12px;padding:0 16px;
  font-size:13.5px;font-weight:800;color:#8B7A63;cursor:pointer}
.minp{flex:1;min-width:54px;height:var(--chip-h);border:1px dashed #E4D3BE;border-radius:999px;padding:0 9px;
  font-size:12px;font-family:inherit;background:#fff;color:var(--ink)}
.send-row{display:flex;gap:5px;margin-top:2px}
.send-row input{flex:1;min-width:0;height:var(--inp-h);border:1px solid #E8DCC9;border-radius:11px;padding:0 10px;
  font-size:13px;font-family:inherit;background:#FFFDF8;color:var(--ink)}
.send-row input::placeholder{color:#C6B7A4}
.sbtn{flex:0 0 auto;height:var(--inp-h);border:1px solid var(--mintd);background:var(--mintd);color:#fff;border-radius:11px;
  padding:0 12px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(95,169,122,.28)}
.mail-log{max-height:112px;overflow:auto;margin-top:7px;border-top:1px dashed #F0E6D8;padding-top:6px;
  display:flex;flex-direction:column;gap:3px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 78%,transparent 100%)}
.mail-log::-webkit-scrollbar{display:none}
.mm{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.3;min-width:0}
.mfrom{font-weight:900;color:#7A6A58;white-space:nowrap}
.arw{color:#CDBFAC}
.mto{font-weight:800;color:#A2937F;white-space:nowrap}
.mtx{color:#6F6252;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mts{color:#C2B5A4;white-space:nowrap;font-variant-numeric:tabular-nums}
.mempty{font-size:11.5px;color:var(--faint)}

/* ---------- 이거 사주세요 ---------- */
.wdesc{font-size:12px;color:var(--sub);margin-bottom:6px}
.winput{width:100%;height:var(--inp-h);border:1px solid #E8DCC9;border-radius:11px;padding:0 10px;font-size:13px;
  font-family:inherit;background:#FFFDF8;color:var(--ink)}
.winput::placeholder{color:#C6B7A4}
.wrow{display:flex;gap:5px;margin-top:5px}
.wrow .winput{flex:1;min-width:0}
.wlist{margin-top:7px;display:flex;flex-direction:column;gap:4px;max-height:132px;overflow:auto;scrollbar-width:none}
.wlist::-webkit-scrollbar{display:none}
.witem{display:flex;align-items:center;gap:6px;background:#FBF7F0;border:1px solid #F2E9DB;border-radius:11px;padding:5px 7px}
.witem.done{background:#F3FAF4;border-color:#DDEDDE}
.wchk{width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:2px solid #DCCEBB;background:#fff;display:grid;
  place-items:center;font-size:11.5px;color:#fff;cursor:pointer;padding:0}
.witem.done .wchk{background:#7FC79A;border-color:#7FC79A}
.wbody{min-width:0;flex:1}
.wname{font-size:13px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem.done .wname{color:#A4B7A7;text-decoration:line-through}
.wmeta{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wprice{color:#B5834A;font-weight:800}
.who{font-size:10.5px;font-weight:900;border-radius:999px;padding:1px 6px;background:#EFE8DA;color:#8A7C6B;white-space:nowrap}
.who.k1{background:#EAF7EC;color:#4E8F63}
.who.k2{background:#FFF1E2;color:#B57F42}
.who.mom{background:#FFEAF1;color:#B8637F}
.who.dad{background:#EAF3FD;color:#4C7FA8}
.wdel{margin-left:auto;border:0;background:transparent;color:#D6C6B3;font-size:12.5px;cursor:pointer;padding:2px 3px}

/* ---------- 달력 · 일정 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cw{text-align:center;font-size:10px;font-weight:900;color:#B4A797;padding-bottom:2px}
.cw.sun{color:#D09A93}
.cw.sat{color:#93AFC9}
.cd{height:19px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#7A6E5F;border-radius:6px}
.cd.blank{background:transparent}
.cd.sun{color:#C4654A}
.cd.sat{color:#5B87B0}
.cd.today{background:#FFF3C9;box-shadow:0 0 0 2px #F4DE9B inset;color:#A9801F;font-weight:900}
.sched{margin-top:7px;border-top:1px dashed #F0E6D8;padding-top:6px}
.sh{font-size:11.5px;font-weight:900;color:#A2937F;margin-bottom:4px}
.si{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0}
.schk{width:16px;height:16px;flex:0 0 16px;border-radius:5px;border:2px solid #DCCEBB;background:#fff;display:grid;
  place-items:center;font-size:10.5px;color:#fff;cursor:pointer;padding:0}
.si.done .schk{background:#7FC79A;border-color:#7FC79A}
.si.done .stx{color:#A4B7A7;text-decoration:line-through}
.stx{letter-spacing:-.3px}
.sadd{display:flex;gap:4px;margin-top:4px}
.sadd input{flex:1;min-width:0;height:26px;border:1px dashed #DFD0BB;border-radius:9px;padding:0 8px;font-size:12px;
  font-family:inherit;background:#FFFDF8;color:var(--ink)}

/* ---------- 밀림 체크 ---------- */
.wk{width:100%;border-collapse:separate;border-spacing:0 2px;table-layout:fixed}
.wk th{font-size:10.5px;color:#A99C8C;font-weight:800;padding-bottom:2px;text-align:center}
.wk th .dnum{font-size:9.5px;color:#C2B5A4;display:block}
.wk td{text-align:center;padding:0}
.wk td.name{text-align:left;font-size:12px;font-weight:900;color:#6F6357;padding-left:2px}
.cell{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;font-size:11px;font-weight:800}
.c-done{background:#E7F6E8;color:#4E9A66}
.c-miss{background:#FCE7E4;color:#C4654A}
.c-today{background:#FFF3C9;color:#A9801F;box-shadow:0 0 0 2px #F4DE9B inset}
.c-void{background:#F7F1E7;color:#DED3C2}
.dday{display:flex;align-items:center;gap:6px;background:var(--sky);border:1px solid #D6E8F8;border-radius:10px;
  padding:4px 9px;margin:6px 0;font-size:11.5px;font-weight:900;color:#3E7CB1}
.dday .rest{margin-left:auto;font-weight:700;color:#7C9DBA;font-size:11px}
.pen{background:#FFF7F3;border:1px dashed #F3D6C8;border-radius:11px;padding:6px 8px}
.pen-t{font-size:11.5px;font-weight:900;color:#B7603F;line-height:1.55}
.pen-star{display:inline-block;margin:2px 0;padding:1px 7px;border-radius:999px;background:#FFECAE;border:1px solid #EBCD80;color:#8F5C08;line-height:1.35}
.pen-li{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.pen-li .who2{font-size:12px;font-weight:900;color:#8A5B45;min-width:16px}
.pen-li .cnt2{font-size:10.5px;font-weight:900;color:#fff;background:#E08E6B;border-radius:999px;padding:1px 6px}
.pen-li input{flex:1;min-width:70px;height:24px;border:1px solid #EFDACF;border-radius:8px;padding:0 7px;font-size:11.5px;
  background:#fff;font-family:inherit;color:var(--ink)}
.pen-ok{font-size:11px;color:#7E9A82;margin-top:5px;font-weight:800}
.pen-log{font-size:10.5px;color:#A0897C;margin-top:4px;line-height:1.35}

/* ---------- 타이머 ---------- */
.chips2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tchip{border:1px solid #E7DCCB;background:#fff;border-radius:999px;height:24px;padding:0 9px;font-size:11.5px;
  font-weight:800;color:#8B7A63;cursor:pointer}
.tchip.on{background:#5FA97A;border-color:#5FA97A;color:#fff}
.tin{width:46px;height:24px;border:1px solid #E7DCCB;border-radius:8px;padding:0 5px;font-size:11.5px;font-family:inherit;
  text-align:center;color:var(--ink)}
.tface{display:flex;align-items:baseline;justify-content:center;gap:8px;background:linear-gradient(160deg,#F5FAF5,#FFFAEE);
  border:1px dashed #DDEBDD;border-radius:12px;padding:5px 0;margin:6px 0}
.ttime{font-size:26px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.05}
.tsub{font-size:10.5px;color:#A2937F;font-weight:800}
.tbtns{display:flex;gap:5px}
.tbtns .btn{flex:1}
.btn{border:1px solid #E6D9C6;background:#fff;border-radius:10px;height:30px;padding:0 10px;font-size:12.5px;
  font-weight:900;color:#6E5E4C;cursor:pointer;font-family:inherit;letter-spacing:-.2px}
.btn:active{transform:scale(.98)}

/* ---------- 토스트 · 축하 ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:rgba(70,60,52,.94);color:#fff;

@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,0),110vh) rotate(540deg)}}

/* ============================================================

/* ---------- 🍱 학교 급식 ---------- */
.ml-top{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap}

.ml-school{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:900;color:#5E7FA8;

.ml-nav{display:flex;align-items:center;gap:4px;margin-bottom:6px}

.ml-tray{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#E8F2FC;

.ml-mon{margin-top:8px;border:1px solid #CFE4D5;background:#EFF9F1;border-radius:999px;padding:3px 10px;

.ml-res b{display:block;font-size:12.5px;font-weight:900;color:#4E4136}
.ml-res small{display:block;font-size:10.5px;color:#A2937F;font-weight:700;margin-top:1px;

/* ---------- 🛍️ 꾸미기 상점 ---------- */

.avtab i{font-style:normal;font-size:9px;font-weight:900;color:#B79BE0;margin-left:2px}
.av-note-lock{margin-top:6px;font-size:10.5px;font-weight:800;color:#A9762F;background:#FFF8E6;

.av-ptown{font-size:9.5px;font-weight:900;color:#7B6B95;background:#fff;border:1px dashed #DCD0F0;

.av-ptlock{font-size:9.5px;font-weight:900;color:#B06A5E;background:#FFF3EF;border:1px solid #F6D9D0;

/* ---------- 🔒 엄마·아빠 전용 PIN 모달 ---------- */
.ppin{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:18px}

.ppin-pad button{height:44px;border:1px solid #EFE4D3;background:#FFFCF5;border-radius:13px;

.ppin-pad button:active{transform:scale(.96);background:#FBF3E6}
.ppin-pad button.fn{font-size:12px;color:#8B7A63;background:#F8F2E7}
.ppin-foot{display:flex}
.ppin-foot button{flex:1;height:34px;border-radius:11px;border:1px solid #E7DCCB;background:#FBF7F0;

/* ===== v15: 자연 놀이터 + 상점/놀이터 분리 ===== */
/* ============================================================
   🌳 자연 놀이터 (360도 3D) — 풀스크린 오버레이
   ============================================================ */
body.pg-open{overflow:hidden!important}
.pg{position:fixed;inset:0;width:100vw;height:100dvh;z-index:2000;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,#9FD6FF 0%,#CFECFF 52%,#FFF4E4 100%);overscroll-behavior:none}
.pg[hidden]{display:none!important}
#pgStage{position:absolute;inset:0}
#pgStage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
#pgLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#pgLabels.off{display:none}
.pg-lbl{position:absolute;transform:translate(-50%,-100%);font-size:9.5px;font-weight:900;letter-spacing:-.3px;
  color:#3F5A42;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:999px;
  padding:1px 7px;white-space:nowrap;box-shadow:0 2px 7px rgba(60,90,60,.14)}
.pg-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:6px;
  padding:calc(9px + env(safe-area-inset-top,0px)) 11px 0;pointer-events:none;z-index:6}
.pg-top > *{pointer-events:auto}
.pg-l{display:flex;flex-direction:column;gap:5px;min-width:0}
.pg-title{align-self:flex-start;font-size:12.5px;font-weight:900;letter-spacing:-.4px;color:#3D6B4C;
  background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:999px;
  padding:3px 11px;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  box-shadow:0 3px 12px rgba(60,110,70,.16)}
.pg-switch{align-self:flex-start;display:flex;gap:2px;padding:2px;border-radius:999px;
  background:rgba(255,255,255,.86);box-shadow:0 3px 12px rgba(60,110,70,.16);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pg-switch button{border:0;background:transparent;border-radius:999px;height:24px;padding:0 11px;
  font-size:11.5px;font-weight:900;color:#8A9C8C;font-family:inherit;cursor:pointer}
.pg-switch button.on{background:linear-gradient(160deg,#BEEBC9,#9FE0B4);color:#2F6B45;
  box-shadow:0 2px 6px rgba(70,150,100,.24)}
.pg-tools{display:flex;gap:5px}
.pg-tools button{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.88);border-radius:999px;
  height:28px;padding:0 11px;font-size:11.5px;font-weight:900;color:#4A6B4F;font-family:inherit;cursor:pointer;
  white-space:nowrap;box-shadow:0 3px 12px rgba(60,110,70,.16);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pg-tools button.off{opacity:.55}
.pg-tools button:active,.pg-switch button:active{transform:scale(.95)}
.pg-exit{margin-left:auto;flex:0 0 auto;height:42px;padding:0 15px;border-radius:15px;border:1.5px solid #F3C9C1;
  background:rgba(255,252,250,.96);color:#C4553F;font-size:14px;font-weight:900;font-family:inherit;
  cursor:pointer;letter-spacing:-.4px;box-shadow:0 4px 16px rgba(140,80,60,.2);white-space:nowrap}
.pg-exit:active{transform:scale(.96)}
.pg-zoom{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;
  flex-direction:column;gap:8px;z-index:5}
.pg-zoom button{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.9);color:#4A6B4F;font-size:19px;font-weight:900;font-family:inherit;
  cursor:pointer;line-height:1;box-shadow:0 4px 14px rgba(60,110,70,.18);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pg-zoom button:active{transform:scale(.94)}
.pg-zoom button.pg-pan-btn.on{background:linear-gradient(160deg,#8FE0AE,#58A972);color:#FFFFFF;
  border-color:#4E9C68;box-shadow:0 4px 14px rgba(60,140,90,.34)}
.pg-hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);max-width:72vw;text-align:center;font-size:11px;font-weight:900;
  color:#41684B;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);
  border-radius:999px;padding:5px 13px;opacity:0;transition:opacity .45s;pointer-events:none;z-index:4;
  box-shadow:0 3px 12px rgba(60,110,70,.16);line-height:1.35}
.pg-hint.on{opacity:1}
.pg-empty{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);font-size:11px;font-weight:900;color:#7B6C56;background:rgba(255,252,243,.94);
  border:1.5px dashed #EED9B8;border-radius:14px;padding:7px 13px;z-index:4;max-width:80vw;text-align:center;
  box-shadow:0 4px 14px rgba(120,100,70,.14);pointer-events:none;line-height:1.4}

  '습관':      { icon: '⭐', bg: '#FFF4CF', ink: '#A8802A', done: '#E3B93F' },
  '기타':      { icon: '📌', bg: '#ECEEF4', ink: '#5C6478', done: '#8C93A6' }
};
/* 이름이 조금 달라도 같은 영역으로 묶는다 (은혜님이 새로 만든 과목 태그도 자동 매핑) */
var AREA_ALIAS = { '영어학원': '영어', '홈스터디': '기타', '사회': '사회·역사', '역사': '사회·역사', '한국사': '사회·역사', '국사': '사회·역사', '음악': '미술', '체육': '기타', '코딩': '기타' };
var AREA_EXTRA = [
  { bg: '#E8F0FB', ink: '#4A6C99', done: '#7B9CC9' },
  { bg: '#FDEBE3', ink: '#A9704A', done: '#D69C74' },
  { bg: '#E9F6EC', ink: '#4C8359', done: '#7DB48B' },
  { bg: '#F3E9F9', ink: '#7B5AA6', done: '#AE8BD1' },
  { bg: '#FFF2DA', ink: '#9A7833', done: '#D4AC5C' },
  { bg: '#E7F5F6', ink: '#3C7F84', done: '#6FB3B8' },
  { bg: '#FBE9F0', ink: '#A75C79', done: '#D492AC' },
  { bg: '#EDF0FA', ink: '#5B6491', done: '#8E97C4' }
];
function areaKey(name){
  var raw = String(name === undefined || name === null ? '' : name).trim();
  var n = raw.replace(/\s+/g, '');
  if (!n) return '기타';
  if (AREA_STYLE[n]) return n;
  if (AREA_ALIAS[n]) return AREA_ALIAS[n];
  var KW = [
    ['수학', ['수학', '연산', '최상위', '쎈', '디딤돌', '사고력']],
    ['국어', ['국어', '독해', '문해', '받아쓰기', '일기', '논술']],
    ['영어', ['영어', 'english', '파닉스', '리스닝', '리딩', 'phonics']],
    ['과학', ['과학', '실험']],
    ['사회·역사', ['사회', '역사', '한국사', '지리']],
    ['한자', ['한자', '급수', '천자문']],
    ['독서', ['독서', '독후', '책']],
    ['미술', ['미술', '그림', '만들기']],
    ['습관', ['습관', '정리', '양치', '씻기', '로션']]
  ];
  var low = n.toLowerCase();
  for (var i = 0; i < KW.length; i++){
    for (var j = 0; j < KW[i][1].length; j++){
      if (low.indexOf(String(KW[i][1][j]).toLowerCase()) > -1) return KW[i][0];
    }
  }
  return raw;      /* 모르는 과목은 이름 그대로 하나의 영역이 된다 */
}
function areaStyle(name){
  var a = areaKey(name);
  if (AREA_STYLE[a]) return AREA_STYLE[a];
  var s = String(a), h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 131 + s.charCodeAt(i)) >>> 0;
  return AREA_EXTRA[h % AREA_EXTRA.length];
}
function areaRank(name){
  var i = AREA_ORDER.indexOf(areaKey(name));
  return i < 0 ? AREA_ORDER.length : i;
}
function areaBadge(name){
  var a = areaKey(name), st = areaStyle(name);
  var ico = String(st.icon || '📌');
  /* 이름이 길면(예: 사회·역사) 아이콘 없이 알약 안에 한 줄로 담는다 */
  var icoHtml = (a.length > 3) ? ''
    : (/^[a-z]+$/i.test(ico) ? '<i class="tx">' + esc(ico) + '</i>' : '<i>' + ico + '</i>');
  return '<span class="smw-ab' + (a.length > 3 ? ' long' : '') + '" style="background:' + st.bg + ';color:' + st.ink + '">'
    + icoHtml + '<span>' + esc(a) + '</span></span>';
}
/* ---------- 주(월~일) 계산 ---------- */
function smWeekMon(){ return smWeek || ymd(mondayOf(new Date())); }
function smWeekDays(){
  var m = ymdParse(smWeekMon()), out = [];
  for (var i = 0; i < 7; i++) out.push(ymd(addDays(m, i)));
  return out;
}
function smShiftWeek(delta){
  var m = ymdParse(smWeekMon());
  smWeek = ymd(addDays(m, delta * 7));
  renderStudyMonth();
}
function smMd(d){ return pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()); }
function smWeekNo(d){
  var first = new Date(d.getFullYear(), d.getMonth(), 1).getDay();
  return Math.ceil((d.getDate() + ((first + 6) % 7)) / 7);
}
/* ---------- 쉬어가기 / 생활 루틴 기록 저장소 ---------- */
function routineHistOf(dk){
  var all = (state && state.routineHistory) || {};
  var day = all[dk];
  return (day && typeof day === 'object') ? day : null;
}
function smRestOf(store, dk, kid){
  var day = store && store[dk];
  return (day && Array.isArray(day[kid])) ? day[kid] : [];
}
function studyRestStore(){ return (state && state.study && state.study.rest && typeof state.study.rest === 'object') ? state.study.rest : {}; }
function routineRestStore(){ return (state && state.routineRest && typeof state.routineRest === 'object') ? state.routineRest : {}; }
function smRestSet(store, dk, kid, key, on){
  var day = (store[dk] && typeof store[dk] === 'object') ? store[dk] : (store[dk] = {});
  var arr = Array.isArray(day[kid]) ? day[kid].slice() : [];
  var i = arr.indexOf(key);
  if (on){ if (i < 0) arr.push(key); }
  else if (i > -1){ arr.splice(i, 1); }
  if (arr.length) day[kid] = arr;
  else {
    delete day[kid];
    if (!Object.keys(day).length) delete store[dk];
  }
}
/* 생활 루틴 스냅샷 — 오늘 kids[morning/evening] 중 '문제집 풀기'류(wb)는 뺀다 */
function smRoutineSnap(s, kid, blank){
  var out = [];
  ['morning', 'evening'].forEach(function(tab){
    (((s.kids || {})[kid] || {})[tab] || []).forEach(function(t){
      if (!t || typeof t.text !== 'string' || !t.text.trim()) return;
      if (isWB(t)) return;
      out.push({ id: t.id, text: t.text, tab: tab, done: blank ? false : !!t.done });
    });
  });
  return out;
}
/* ---------- 주간 표의 행(루틴) 모으기 ---------- */
function smStatRows(kid){
  var days = smWeekDays(), today = todayKey();
  var weekly = studyWeekMap(kid), histAll = smHistory();
  var restS = studyRestStore(), restR = routineRestStore();
  var rows = [], byKey = {};
  days.forEach(function(dk){
    var dow = String(ymdParse(dk).getDay());
    var isToday = (dk === today);
    var map = {}, order = [];
    function put(key, kind, text, area, tab, planned, done){
      var c = map[key];
      if (!c){ c = map[key] = { kind: kind, text: text, area: area, tab: tab || '', planned: false, done: false }; order.push(key); }
      if (planned) c.planned = true;
      if (done) c.done = true;
    }
    /* (1) 공부 — 그 요일 반복 계획 + 그날 기록(오늘은 오늘의 체크리스트) */
    (Array.isArray(weekly[dow]) ? weekly[dow] : []).forEach(function(w){
      if (!w || !w.text) return;
      var sn = w.subjectName || '';
      put('S|' + sn + '|' + w.text, 'study', w.text, sn, '', true, false);
    });
    var rec = isToday ? studyItems(kid) : ((histAll[dk] && histAll[dk][kid]) || []);
    (Array.isArray(rec) ? rec : []).forEach(function(x){
      if (!x || !x.text) return;
      var sn = x.subjectName || '';
      put('S|' + sn + '|' + x.text, 'study', x.text, sn, '', true, !!x.done);
    });
    /* (2) 생활 루틴 — 오늘은 지금 루틴, 지난 날은 routineHistory(기록이 없으면 계획일로만) */
    var rArr = null;
    if (isToday){
      rArr = smRoutineSnap(state, kid);
    } else {
      var rh = routineHistOf(dk);
      rArr = (rh && Array.isArray(rh[kid])) ? rh[kid] : null;
      if (!rArr){
        rArr = smRoutineSnap(state, kid).map(function(t){ return { id: t.id, text: t.text, tab: t.tab, done: false }; });
      }
    }
    rArr.forEach(function(t){
      if (!t || !t.id || !t.text || isWB(t)) return;
      var area = (String(t.text).replace(/\s+/g, '') === '독서') ? '독서' : '습관';
      put('R|' + t.id, 'routine', t.text, area, t.tab, true, !!t.done);
    });
    /* 셀 상태 — 쉬어가기 > 완료 > 계획일 > 계획 없음 */
    order.forEach(function(key){
      var c = map[key];
      var r = byKey[key];
      if (!r){
        r = byKey[key] = {
          key: key, kind: c.kind, text: c.text, area: c.area,
          subject: (c.kind === 'study') ? c.area : '',
          id: (c.kind === 'routine') ? key.slice(2) : '',
          tab: c.tab || '', cells: {}, planned: {}, idx: rows.length
        };
        rows.push(r);
      }
      if (!r.tab && c.tab) r.tab = c.tab;
      var restList = smRestOf(c.kind === 'routine' ? restR : restS, dk, kid);
      var st;
      if (restList.indexOf(key) > -1) st = 'rest';
      else if (c.done) st = 'done';
      else if (c.planned) st = 'plan';
      else st = 'none';
      r.cells[dk] = st;
      r.planned[dk] = !!c.planned;
    });
  });
  rows.sort(function(a, b){
    var d = areaRank(a.area) - areaRank(b.area);
    if (d) return d;
    var s = String(a.area).localeCompare(String(b.area), 'ko');
    if (s) return s;
    return a.idx - b.idx;
  });
  /* 아침·저녁에 같은 이름의 생활 루틴이 있으면 ☀/🌙 로 구분해 준다 */
  var dup = {};
  rows.forEach(function(r){ if (r.kind === 'routine') dup[r.text] = (dup[r.text] || 0) + 1; });
  rows.forEach(function(r){
    r.label = (r.kind === 'routine' && dup[r.text] > 1)
      ? ((r.tab === 'evening') ? '🌙 ' : '☀ ') + r.text
      : r.text;
  });
  return rows;
}
/* ---------- 셀 클릭 → 계획일/없음 → 완료 ✓ → 쉬어가기 🌿 → 되돌리기 ---------- */
function smSetStudy(s, kid, dk, r, val){
  var st = studyEnsure(s);
  if (dk === todayKey()){
    var list = (st.items[kid] || []).slice(), it = null;
    for (var i = 0; i < list.length; i++){
      if ((list[i].subjectName || '') === r.subject && list[i].text === r.text){ it = list[i]; break; }
    }
    if (!it){
      if (!val) return;
      list.push({ id: uid('st'), subjectName: r.subject, text: r.text, done: true });
      st.items[kid] = list;
    } else {
      it.done = !!val;
    }
    return;
  }
  st.history = (st.history && typeof st.history === 'object') ? st.history : {};
  var day = (st.history[dk] && typeof st.history[dk] === 'object') ? st.history[dk] : (st.history[dk] = {});
  var arr = Array.isArray(day[kid]) ? day[kid].slice() : [], ex = null;
  for (var j = 0; j < arr.length; j++){
    if ((arr[j].subjectName || '') === r.subject && arr[j].text === r.text){ ex = arr[j]; break; }
  }
  if (!ex){
    if (!val) return;
    arr.push({ id: uid('sh'), subjectName: r.subject, text: r.text, done: true });
  } else ex.done = !!val;
  day[kid] = arr;
}
function smSetRoutine(s, kid, dk, r, val){
  if (dk === todayKey()){
    var tabs = ['morning', 'evening'];
    for (var i = 0; i < tabs.length; i++){
      var list = ((s.kids || {})[kid] || {})[tabs[i]] || [];
      for (var j = 0; j < list.length; j++){
        if (list[j].id === r.id){ list[j].done = !!val; return; }
      }
    }
    return;
  }
  if (!s.routineHistory || typeof s.routineHistory !== 'object') s.routineHistory = {};
  var day = (s.routineHistory[dk] && typeof s.routineHistory[dk] === 'object') ? s.routineHistory[dk] : null;
  if (!day){ if (!val) return; day = s.routineHistory[dk] = {}; }
  var arr = Array.isArray(day[kid]) ? day[kid].slice() : smRoutineSnap(s, kid, true), ex = null;
  for (var k = 0; k < arr.length; k++){ if (arr[k].id === r.id){ ex = arr[k]; break; } }
  if (!ex){
    if (!val) return;
    arr.push({ id: r.id, text: r.text, tab: r.tab || 'morning', done: true });
  } else ex.done = !!val;
  day[kid] = arr;
}
function smCellToggle(kid, key, dk){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dk || '')) || dk > todayKey()) return;
  var rows = smStatRows(kid), r = null;
  for (var i = 0; i < rows.length; i++){ if (rows[i].key === key){ r = rows[i]; break; } }
  if (!r) return;
  var cur = r.cells[dk] || 'none';
  var next = (cur === 'done') ? 'rest' : (cur === 'rest') ? (r.planned[dk] ? 'plan' : 'none') : 'done';
  mutate(function(s){
    var store;
    if (r.kind === 'study'){
      studyEnsure(s);
      store = s.study.rest;
      smRestSet(store, dk, kid, key, next === 'rest');
      smSetStudy(s, kid, dk, r, next === 'done');
    } else {
      if (!s.routineRest || typeof s.routineRest !== 'object') s.routineRest = {};
      store = s.routineRest;
      smRestSet(store, dk, kid, key, next === 'rest');
      smSetRoutine(s, kid, dk, r, next === 'done');
    }
  });
  renderStudy();
  try { renderKids(); } catch(e){}
}
/* ---------- 모달 머리(제목·자녀·탭) ---------- */
function smKidChipsHtml(kid){
  return KIDS.map(function(id){
    var nm = (FAMILY[id] || {}).name || id;
    var g = gradeTag(id);
    return '<button class="sm-kid' + (id === kid ? ' on' : '') + '" type="button" data-act="sm-kid"'
      + ' data-k="' + esc(id) + '" aria-pressed="' + (id === kid ? 'true' : 'false') + '">'
      + esc(nm + (g ? ' (' + g + ')' : '')) + '</button>';
  }).join('');
}
function smHeadHtml(kid){
  var sub = (smTab === 'month') ? '날짜를 누르면 그날의 공부를 볼 수 있어요.'
                                : '공부·생활 루틴을 한눈에 · 날짜 칸을 눌러 완료·🌿 쉬어가기 수정';
  return '<div class="sm-h"><div><b>📊 루틴 통계</b>'
    +   '<p>' + sub + '</p></div>'
    +   '<button class="sm-x" type="button" data-act="sm-close" aria-label="닫기">✕</button></div>'
    + '<div class="sm-kids" role="group" aria-label="자녀 선택">' + smKidChipsHtml(kid) + '</div>'
    + '<div class="sm-tabs" role="tablist">'
    +   '<button class="sm-tab' + (smTab === 'week' ? ' on' : '') + '" type="button" data-act="sm-tab" data-t="week" role="tab" aria-selected="' + (smTab === 'week' ? 'true' : 'false') + '">' + SM_IC_GRID + '주간 흐름</button>'
    +   '<button class="sm-tab' + (smTab === 'month' ? ' on' : '') + '" type="button" data-act="sm-tab" data-t="month" role="tab" aria-selected="' + (smTab === 'month' ? 'true' : 'false') + '">' + SM_IC_CAL + '월간 기록</button>'
    + '</div>';
}
/* ---------- 주간 흐름 탭 ---------- */
function smWeekHtml(kid){
  var days = smWeekDays(), today = todayKey();
  var mon = ymdParse(days[0]), sun = ymdParse(days[6]);
  var thisMon = ymd(mondayOf(new Date()));
  var away = Math.round((new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()) - new Date(ymdParse(thisMon).getFullYear(), ymdParse(thisMon).getMonth(), ymdParse(thisMon).getDate())) / 604800000);
  var label = (away === 0) ? '이번 주'
            : (away === -1) ? '지난주'
            : (away === 1) ? '다음주'
            : (mon.getMonth() + 1) + '월 ' + smWeekNo(mon) + '주차';
  var range = smMd(mon) + ' (' + DOW_NAME[String(mon.getDay())] + ') - ' + smMd(sun) + ' (' + DOW_NAME[String(sun.getDay())] + ')';

  var nav = '<div class="smw-nav">'
    +   '<button type="button" data-act="sm-wprev" aria-label="지난주">‹</button>'
    +   '<div class="smw-mid"><b>' + label + '</b><span>' + range + '</span></div>'
    +   '<button type="button" data-act="sm-wnext" aria-label="다음주">›</button>'
    + '</div>';

  var headCells = days.map(function(dk){
    var d = ymdParse(dk);
    return '<div class="smw-th' + (dk === today ? ' tod' : '') + '"><div>'
      + DOW_NAME[String(d.getDay())] + '<em>' + d.getDate() + '</em></div></div>';
  }).join('');
  var head = '<div class="smw-row smw-th">'
    + '<div class="lab">영역</div><div class="lab2">루틴</div>' + headCells + '</div>';

  var rows = smStatRows(kid);
  var body = '', lastArea = '';
  rows.forEach(function(r){
    var stl = areaStyle(r.area);
    var newGrp = (r.area !== lastArea);
    lastArea = r.area;
    body += '<div class="smw-row' + (newGrp && body ? ' g' : '') + '">'
      + '<div class="smw-ar">' + (newGrp ? areaBadge(r.area) : '') + '</div>'
      + '<div class="smw-rn' + (newGrp ? ' b' : '') + '">' + esc(r.label || r.text) + '</div>';
    days.forEach(function(dk){
      var c = r.cells[dk] || 'none';
      var live = (dk <= today);
      var inner = (c === 'done') ? '✓' : (c === 'rest') ? '🌿' : (c === 'plan') ? '' : '–';
      var d = ymdParse(dk);
      body += '<div class="smw-cw"><button class="smw-c ' + c + (live ? '' : ' fut') + '" type="button"'
        + (live ? ' data-act="sm-cell" data-row="' + esc(r.key) + '" data-col="' + dk + '"' : ' disabled')
        + ' style="--dc:' + stl.done + '"'
        + ' aria-label="' + esc(r.label || r.text) + ' · ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 · ' + SM_CELL_LABEL[c] + '">'
        + inner + '</button></div>';
    });
    body += '</div>';
  });
  if (!rows.length) body = '<div class="smw-none">이 주에 잡힌 루틴이 없어요</div>';

  var legend = '<div class="smw-leg">'
    + '<b><i class="smw-lc">✓</i>완료</b>'
    + '<b><i class="smw-lc gr">🌿</i>쉬어가기</b>'
    + '<b><i class="smw-lc pl"></i>계획일</b>'
    + '<b><i class="smw-lc no">–</i>계획 없음</b>'
    + '</div>';

  return nav + '<div class="smw-card"><div class="smw">' + head + body + '</div></div>' + legend;
}
