<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>390px 확인</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE}
  body{display:flex;justify-content:center;padding:10px 0}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#FFFDF9}
</style></head>
<body><iframe id="f" src="ride-check.html"></iframe>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function(){
  var w = f.contentWindow, tries = 0, opened = false;
  var q = new URLSearchParams(location.search);
  var t = Number(q.get('t') || 4.0), ride = q.get('ride') || 'swing';
  var iv = setInterval(function(){
    tries++;
    var pg = w.__pg;
    if (pg && !opened){ opened = true; try { pg.open('k1'); } catch(e){} }
    if (pg && pg.state.ready && pg.countRides()){
      clearInterval(iv);
      pg.look(ride, Math.PI * 0.92, 1.12, 6.2, 1.25);
      pg.halt();
      pg.frame(t);
      w.__shotReady = true;
    }
    if (tries > 120) clearInterval(iv);
  }, 250);
});
</script></body></html>
