<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>390px 확인</title>
<style>
  html,body{margin:0;padding:0;background:#DED8CE}
  body{display:flex;justify-content:center;padding:10px 0}
  iframe{width:390px;height:844px;border:0;border-radius:16px;background:#FFFDF9}
</style></head>
<body><iframe id="f" src="ride-check.html"></iframe>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function(){
  var w = f.contentWindow, tries = 0, opened = false;
  var q = new URLSearchParams(location.search);
  var t = Number(q.get('t') || 4.0);
  var po = Number(q.get('po') || 1.25), di = Number(q.get('di') || 5.4), ty = Number(q.get('ty') || 1.15);
  var iv = setInterval(function(){
    tries++;
    var pg = w.__pg;
    if (pg && !opened){ opened = true; try { pg.open('k1'); } catch(e){} }
    if (pg && pg.ready() && pg.countRides()){
      clearInterval(iv);
      pg.halt();
      pg.frame(t);
      pg.lookChar(0, po, di, ty);
      pg.frame(t);
      w.__shotReady = true;
    }
    if (tries > 120) clearInterval(iv);
  }, 250);
});
</script></body></html>
